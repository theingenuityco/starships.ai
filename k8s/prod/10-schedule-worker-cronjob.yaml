apiVersion: batch/v1
kind: CronJob
metadata:
  name: starships-schedule-worker
  namespace: starships-prod
  labels:
    app: starships-ai
    component: schedule-worker
    environment: production
spec:
  # Run every 5 minutes; adjust for production needs
  schedule: '*/5 * * * *'
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: starships-ai
            component: schedule-worker
            environment: production
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: schedule-worker
              image: ghcr.io/theingenuityco/starships.ai:latest
              imagePullPolicy: Always
              env:
                - name: NODE_ENV
                  value: 'production'
                - name: AUTOPILOT_RUNNER
                  value: 'remote'
                - name: RUNNER_URL
                  value: 'http://autopilot-runner.starships-prod.svc.cluster.local:50051'
                - name: RUNNER_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: RUNNER_AUTH_TOKEN
                - name: SKIP_BUILD
                  value: 'true'
                - name: SKIP_INSTALL
                  value: 'true'
                - name: PUBLIC_URL
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: PUBLIC_URL
                - name: CLIENT_URL
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: CLIENT_URL
                - name: SERVER_URL
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: SERVER_URL
                - name: DOCS_URL
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: DOCS_URL
                - name: JWT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: JWT_SECRET
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: POSTGRES_HOST
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: POSTGRES_PORT
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: POSTGRES_DATABASE
                - name: POSTGRES_SSL
                  valueFrom:
                    secretKeyRef:
                      name: starships-secrets
                      key: POSTGRES_SSL
                - name: PGDATA
                  value: '/var/lib/postgresql/data/pgdata'
              command:
                - /bin/sh
                - -lc
                - |
                  cd /app && pnpm --filter @starships/server run schedule:run
