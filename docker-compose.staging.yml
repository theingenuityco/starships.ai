version: '3.8'

services:
  # Neo4j database for staging
  neo4j-staging:
    image: neo4j:5.26.8
    container_name: neo4j-staging
    environment:
      - NEO4J_AUTH=neo4j/stagingpassword
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*
    ports:
      - "7475:7474"  # HTTP (different from prod)
      - "7688:7687"  # Bolt (different from prod)
    volumes:
      - neo4j_staging_data:/data
      - neo4j_staging_logs:/logs
      - neo4j_staging_import:/var/lib/neo4j/import
      - neo4j_staging_plugins:/plugins
    networks:
      - starships-staging
      - starships-test-starship

  # Starships server in staging mode
  starships-server-staging:
    build:
      context: .
      dockerfile: packages/server/Dockerfile.neo4j
    container_name: starships-server-staging
    environment:
      - NODE_ENV=staging
      - PORT=4001
      - NEO4J_URI=bolt://neo4j-staging:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=stagingpassword
      - NEO4J_DATABASE=neo4j
      # Feature flag for HTTP bridge (default: true)
      - MCP_HTTP_BRIDGE_ENABLED=true
      # Enable testing backdoor for auth
      - ENABLE_AUTH_TESTING_BACKDOOR=true
      - CLIENT_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:4001
    ports:
      - "4001:4001"
    depends_on:
      - neo4j-staging
    networks:
      - starships-staging
      - starships-test-starship
    restart: unless-stopped

  # Test HTTP Bridge MCP Server (Brave Search)
  mcp-test-brave-http:
    image: starships/mcp-http-bridge:latest
    container_name: mcp-test-starship-brave-http
    environment:
      # HTTP Bridge configuration
      - MCP_SERVER_CMD=npx
      - MCP_SERVER_ARGS=-y @modelcontextprotocol/server-brave-search
      - HTTP_PORT=8080
      - LOG_LEVEL=info
      - HEALTH_CHECK_TIMEOUT=10000
      - MAX_CONCURRENT_REQUESTS=10
      # Brave API configuration (placeholder)
      - BRAVE_API_KEY=placeholder_key_for_testing
    ports:
      - "8081:8080"  # Expose for testing
    networks:
      - starships-test-starship
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - "starship.id=test-starship"
      - "connector.id=test-brave-connector"
      - "mcp.type=brave"
      - "mcp.protocol=http"
      - "mcp.runtime=bridge"
      - "mcp.version=1.0.0"
      - "managed-by=starships-staging"
      - "service.type=mcp-http-bridge"

  # Test Legacy MCP Server (Brave Search) for comparison
  mcp-test-brave-legacy:
    image: starships/mcp-node:latest
    container_name: mcp-test-starship-brave-legacy
    command: ['sh', '-c', '(echo ''{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"capabilities": {}, "clientInfo": {"name": "starship", "version": "1.0.0"}}}''; sleep infinity) | npx -y @modelcontextprotocol/server-brave-search']
    environment:
      - BRAVE_API_KEY=placeholder_key_for_testing
    networks:
      - starships-test-starship
    healthcheck:
      test: ["CMD", "pgrep", "-f", "server-brave-search"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - "starship.id=test-starship"
      - "connector.id=test-brave-legacy-connector"
      - "mcp.type=brave"
      - "mcp.protocol=stdio"
      - "mcp.runtime=node"
      - "managed-by=starships-staging"
      - "service.type=mcp-legacy"

volumes:
  neo4j_staging_data:
  neo4j_staging_logs:
  neo4j_staging_import:
  neo4j_staging_plugins:

networks:
  starships-staging:
    driver: bridge
  starships-test-starship:
    driver: bridge
    name: starship-test-starship