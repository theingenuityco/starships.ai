name: Uptime Monitor with Discord Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

jobs:
  check-health:
    name: Check Service Health
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "Production"
            environment: "prod"
            emoji: "🚀"
            channel_name: "incidents"  # Production alerts to #incidents
          - name: "Development"
            environment: "dev"  
            emoji: "🛠️"
            channel_name: "dev-alerts"  # Dev alerts to #dev-alerts
    
    environment: ${{ matrix.environment }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Discord.js
        run: |
          # Check if discord.js is already installed, if not install it
          if [ ! -d ".github/scripts/node_modules/discord.js" ]; then
            cd .github/scripts
            npm install discord.js
          fi
      
      - name: Check Health
        id: health_check
        env:
          SERVICE_URL: ${{ vars.CLIENT_URL || vars.KINDE_SITE_URL }}
          SERVICE_NAME: ${{ matrix.name }}
        run: |
          # Verify URL is set
          if [ -z "$SERVICE_URL" ]; then
            echo "❌ ERROR: SERVICE_URL not set for $SERVICE_NAME environment"
            echo "status=misconfigured" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "Checking health of $SERVICE_NAME at $SERVICE_URL"
          
          # Perform health check
          START_TIME=$(date +%s%3N)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$SERVICE_URL/api/health" || echo "000")
          END_TIME=$(date +%s%3N)
          RESPONSE_TIME=$((END_TIME - START_TIME))
          
          echo "HTTP Code: $HTTP_CODE"
          echo "Response Time: ${RESPONSE_TIME}ms"
          
          # Store results
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "response_time=$RESPONSE_TIME" >> $GITHUB_OUTPUT
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          
          # Determine status
          if [ "$HTTP_CODE" = "200" ]; then
            echo "status=operational" >> $GITHUB_OUTPUT
            echo "✅ $SERVICE_NAME is operational"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "status=timeout" >> $GITHUB_OUTPUT
            echo "⏱️ $SERVICE_NAME timed out"
          else
            echo "status=down" >> $GITHUB_OUTPUT
            echo "🔴 $SERVICE_NAME is down"
          fi
      
      - name: Load Previous Status
        id: previous_status
        run: |
          if [ -f ".github/status/${{ matrix.environment }}-status.txt" ]; then
            PREV_STATUS=$(cat .github/status/${{ matrix.environment }}-status.txt)
            echo "previous=$PREV_STATUS" >> $GITHUB_OUTPUT
          else
            echo "previous=unknown" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Discord Alert via Bot
        if: steps.health_check.outputs.status != 'operational' || (steps.previous_status.outputs.previous != 'operational' && steps.health_check.outputs.status == 'operational')
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          CHANNEL_NAME: ${{ matrix.channel_name }}
          STATUS: ${{ steps.health_check.outputs.status }}
          PREV_STATUS: ${{ steps.previous_status.outputs.previous }}
          HTTP_CODE: ${{ steps.health_check.outputs.http_code }}
          RESPONSE_TIME: ${{ steps.health_check.outputs.response_time }}
          SERVICE_URL: ${{ steps.health_check.outputs.service_url }}
          SERVICE_NAME: ${{ matrix.name }}
          SERVICE_EMOJI: ${{ matrix.emoji }}
        run: |
          cat << 'EOF' > send-alert.js
          const { Client, GatewayIntentBits, EmbedBuilder } = require('discord.js');
          
          async function sendAlert() {
            const client = new Client({
              intents: [
                GatewayIntentBits.Guilds,
                GatewayIntentBits.GuildMessages
              ]
            });
            
            try {
              await client.login(process.env.DISCORD_BOT_TOKEN);
              console.log('Bot logged in successfully');
              
              // Get the guild
              const guild = await client.guilds.fetch(process.env.DISCORD_GUILD_ID);
              
              // Find the channel by name
              const channel = guild.channels.cache.find(
                ch => ch.name === process.env.CHANNEL_NAME && ch.type === 0 // 0 = text channel
              );
              
              if (!channel) {
                console.error(`Channel #${process.env.CHANNEL_NAME} not found`);
                process.exit(1);
              }
              
              // Determine alert type and color
              let title, color, description;
              const status = process.env.STATUS;
              const serviceName = process.env.SERVICE_NAME;
              const emoji = process.env.SERVICE_EMOJI;
              
              if (status === 'operational') {
                title = '✅ SERVICE RECOVERED';
                color = 0x57F287; // Green
                description = `${emoji} **${serviceName}** is back online!`;
              } else if (status === 'timeout') {
                title = '⏱️ SERVICE TIMEOUT';
                color = 0xFEE75C; // Orange
                description = `${emoji} **${serviceName}** is not responding (timeout after 10s)`;
              } else {
                title = '🚨 SERVICE DOWN';
                color = 0xED4245; // Red
                description = `${emoji} **${serviceName}** is currently unavailable`;
              }
              
              // Create embed
              const embed = new EmbedBuilder()
                .setTitle(title)
                .setDescription(description)
                .setColor(color)
                .addFields(
                  { name: '🌐 Service', value: serviceName, inline: true },
                  { name: '📊 Status', value: status, inline: true },
                  { name: '⚡ Response', value: `${process.env.RESPONSE_TIME}ms`, inline: true },
                  { name: '🔗 URL', value: process.env.SERVICE_URL, inline: false },
                  { name: '💻 HTTP Code', value: process.env.HTTP_CODE, inline: true },
                  { name: '⏰ Time', value: new Date().toUTCString(), inline: true }
                )
                .setFooter({ text: 'Starships Uptime Monitor' })
                .setTimestamp();
              
              // Send the message
              await channel.send({ embeds: [embed] });
              console.log(`Alert sent to #${process.env.CHANNEL_NAME}`);
              
              // Cleanup
              client.destroy();
            } catch (error) {
              console.error('Error sending alert:', error.message);
              process.exit(1);
            }
          }
          
          sendAlert();
          EOF
          
          node send-alert.js
      
      - name: Update Status
        if: always()
        run: |
          mkdir -p .github/status
          echo "${{ steps.health_check.outputs.status }}" > .github/status/${{ matrix.environment }}-status.txt
          
          # Only commit if status changed
          if [ "${{ steps.health_check.outputs.status }}" != "${{ steps.previous_status.outputs.previous }}" ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add .github/status/
            git diff --staged --quiet || git commit -m "chore: update ${{ matrix.environment }} status to ${{ steps.health_check.outputs.status }}"
            git push || echo "No changes to push"
          fi