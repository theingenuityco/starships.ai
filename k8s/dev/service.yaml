apiVersion: v1
kind: Service
metadata:
  name: starships-app-internal
  namespace: starships-dev
  labels:
    app: starships-ai
    environment: dev
spec:
  type: ClusterIP
  selector:
    app: starships-ai
    environment: dev
  ports:
  - name: frontend
    port: 3000
    targetPort: 3000
  - name: backend
    port: 4000
    targetPort: 4000
  - name: neo4j-http
    port: 7474
    targetPort: 7474
  - name: neo4j-bolt
    port: 7687
    targetPort: 7687