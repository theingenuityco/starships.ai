apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-all
  namespace: starships-prod
spec:
  template:
    spec:
      containers:
      - name: starships-all
        env:
        - name: KINDE_CLIENT_ID
          value: "[KINDE-CLIENT-ID]"
        - name: KINDE_CLIENT_SECRET
          value: "[API-KEY]"
        - name: KINDE_ISSUER_URL
          value: "[KINDE-ISSUER-URL]"
        - name: KINDE_SITE_URL
          value: "[INSECURE-PROD-URL]"
        - name: KINDE_POST_LOGIN_REDIRECT_URL
          value: "[INSECURE-PROD-URL]/fleet"
        - name: KINDE_POST_LOGOUT_REDIRECT_URL
          value: "[INSECURE-PROD-URL]"