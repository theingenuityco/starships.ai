apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-app
  namespace: starships-dev
  labels:
    app: starships-ai
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: starships-ai
      environment: dev
  template:
    metadata:
      labels:
        app: starships-ai
        environment: dev
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      # Security Context - Run as non-root user for security
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      
      imagePullSecrets:
      - name: ghcr-pull-secret
      
      containers:
      - name: starships
        image: [DOCKER-REGISTRY-URL]:latest  # Updated by CI/CD
        imagePullPolicy: Always
        
        ports:
        - containerPort: 3000
          name: frontend
          protocol: TCP
        - containerPort: 4000
          name: backend
          protocol: TCP
        - containerPort: 7474
          name: neo4j-http
          protocol: TCP
        - containerPort: 7687
          name: neo4j-bolt
          protocol: TCP
        
        # Development Environment Variables
        env:
        # Core Settings
        - name: NODE_ENV
          value: "production"
        - name: SKIP_BUILD
          value: "true"
        - name: SKIP_INSTALL
          value: "true"
        
        # URLs (from secrets for flexibility)
        - name: CLIENT_URL
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: CLIENT_URL
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: NEXT_PUBLIC_API_URL
        - name: NEXT_PUBLIC_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: NEXT_PUBLIC_SERVER_URL
        - name: SERVER_URL
          value: "http://localhost:4000"  # Internal service URL, always the same
        
        # Neo4j Configuration
        - name: NEO4J_URI
          value: "[NEO4J-LOCAL-URL]"
        - name: NEO4J_USERNAME
          value: "neo4j"
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: NEO4J_PASSWORD
        - name: NEO4J_AUTH
          value: "neo4j/$(NEO4J_PASSWORD)"
        
        # Kinde OAuth URLs (from secrets for flexibility)
        - name: KINDE_ISSUER_URL
          valueFrom:
            secretKeyRef:
              name: kinde-auth-secret
              key: KINDE_ISSUER_URL
        - name: KINDE_SITE_URL
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: KINDE_SITE_URL
        - name: KINDE_POST_LOGIN_REDIRECT_URL
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: KINDE_POST_LOGIN_REDIRECT_URL
        - name: KINDE_POST_LOGOUT_REDIRECT_URL
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: KINDE_POST_LOGOUT_REDIRECT_URL
        - name: KINDE_REDIRECT_URL
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: KINDE_REDIRECT_URL
        - name: KINDE_COOKIE_DOMAIN
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: KINDE_COOKIE_DOMAIN
        
        # Security: Disable testing backdoor, enable debug for dev
        - name: NEXT_PUBLIC_ENABLE_AUTH_TESTING_BACKDOOR
          value: "false"  # Use proper Kinde authentication
        - name: KINDE_DEBUG_MODE
          value: "true"   # Enable debug logs for development
        
        # API Keys from Secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: OPENAI_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: ANTHROPIC_API_KEY
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_WEBHOOK_SECRET
        - name: STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_PUBLISHABLE_KEY
        
        # Pull Kinde secrets
        envFrom:
        - secretRef:
            name: kinde-auth-secret
        
        # Resource Limits
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        # Volume Mounts
        volumeMounts:
        - name: neo4j-data
          mountPath: /var/lib/neo4j/data
        - name: app-sessions
          mountPath: /app/data/sessions
        
      # Volumes
      volumes:
      - name: neo4j-data
        persistentVolumeClaim:
          claimName: neo4j-data-pvc
      - name: app-sessions
        persistentVolumeClaim:
          claimName: sessions-pvc