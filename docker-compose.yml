version: '3.8'

services:
  # All-in-One Container: Frontend + Backend + Neo4j (configurable)
  starships:
    image: ghcr.io/theingenuityco/starships.ai:latest
    container_name: starships-all-in-one
    restart: unless-stopped
    ports:
      - '3000:3000' # Frontend (Next.js)
      - '4000:4000' # Backend (Express)
      - '7474:7474' # Neo4j Browser (only if using internal Neo4j)
      - '7687:7687' # Neo4j Bolt (only if using internal Neo4j)
    environment:
      # Core Configuration
      NODE_ENV: production
      SERVER_PORT: ${SERVER_PORT:-4000}
      CLIENT_PORT: ${CLIENT_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # URLs
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SERVER_URL: ${SERVER_URL:-http://localhost:4000}

      # Neo4j Configuration - Choose ONE of the following options:

      # Option 1: Use INTERNAL Neo4j (default - runs Neo4j inside container)
      # Leave NEO4J_EXTERNAL_URI unset or empty
      NEO4J_URI: ${NEO4J_URI:-bolt://localhost:7687} # Will be auto-set if using internal
      # Option 2: Use EXTERNAL Neo4j (e.g., Neo4j Aura)
      # Uncomment and set the following to use external Neo4j:
      # NEO4J_EXTERNAL_URI: neo4j+s://xxxxxxxx.databases.neo4j.io
      # NEO4J_EXTERNAL_URI: bolt://your-neo4j-host:7687

      # Neo4j Credentials (for both internal and external)
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}

      # Authentication
      JWT_SECRET: ${JWT_SECRET:-your-super-secure-jwt-secret-key-at-least-32-characters-long}

      # LLM Provider Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-gpt-4o}

      # Stripe Configuration
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_CRUISER_MONTHLY: ${STRIPE_PRICE_CRUISER_MONTHLY}
      STRIPE_PRICE_CRUISER_YEARLY: ${STRIPE_PRICE_CRUISER_YEARLY}
      STRIPE_PRICE_DRAUGHT_MONTHLY: ${STRIPE_PRICE_DRAUGHT_MONTHLY}
      STRIPE_PRICE_DRAUGHT_YEARLY: ${STRIPE_PRICE_DRAUGHT_YEARLY}

      # Analytics
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID}

    volumes:
      # Application data
      - starships-data:/app/data

      # Neo4j data (only used if internal Neo4j is active)
      - neo4j-data:/var/lib/neo4j/data
      - neo4j-logs:/var/lib/neo4j/logs

      # Cache for faster restarts
      - node-modules:/app/node_modules
      - client-next-cache:/app/packages/client/.next
      - server-dist-cache:/app/packages/server/dist

    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000 && wget -q --spider http://localhost:4000/health']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s # 5 minutes for Neo4j startup + build

    networks:
      - starships-network

volumes:
  # Application volumes
  starships-data:
    driver: local

  # Neo4j volumes (only used with internal Neo4j)
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local

  # Cache volumes
  node-modules:
    driver: local
  client-next-cache:
    driver: local
  server-dist-cache:
    driver: local

networks:
  starships-network:
    driver: bridge
