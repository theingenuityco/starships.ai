version: '3.8'

services:
  # Application container: Frontend + Backend (uses external PostgreSQL)
  starships:
    image: ghcr.io/theingenuityco/starships.ai:latest
    container_name: starships-all-in-one
    restart: unless-stopped
    ports:
      - '3000:3000' # Frontend (Next.js)
      - '4000:4000' # Backend (Express)
    environment:
      # Core Configuration
      NODE_ENV: production
      SERVER_PORT: ${SERVER_PORT:-4000}
      CLIENT_PORT: ${CLIENT_PORT:-3000}

      # URLs
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SERVER_URL: ${SERVER_URL:-http://localhost:4000}

      # PostgreSQL Configuration (external database)
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}

      # PostgreSQL Credentials
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-starships}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}

      # Authentication
      JWT_SECRET: ${JWT_SECRET:-your-super-secure-jwt-secret-key-at-least-32-characters-long}

      # Environment Variables Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # LLM Provider Configuration
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      # Stripe Configuration
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # Analytics
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID}
      USERBACK_TOKEN: ${USERBACK_TOKEN}

      # AWS Configuration (SES and S3)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SES_REGION: ${AWS_SES_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}

    volumes:
      # Application data
      - starships-data:/app/data

      # Cache for faster restarts
      - node-modules:/app/node_modules
      - client-next-cache:/app/packages/client/.next
      - server-dist-cache:/app/packages/server/dist

    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000 && wget -q --spider http://localhost:4000/api/v1/health']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s # 2 minutes for PostgreSQL startup + build

    networks:
      - starships-network

volumes:
  # Application volumes
  starships-data:
    driver: local

  # Cache volumes
  node-modules:
    driver: local
  client-next-cache:
    driver: local
  server-dist-cache:
    driver: local

networks:
  starships-network:
    driver: bridge
