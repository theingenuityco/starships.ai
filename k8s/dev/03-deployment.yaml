apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-app
  namespace: starships-dev
  labels:
    app: starships-ai
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: starships-ai
      environment: dev
  template:
    metadata:
      labels:
        app: starships-ai
        environment: dev
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: starships
          image: 'PLACEHOLDER_IMAGE:latest' # CI will replace with actual tag
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
              name: frontend
              protocol: TCP
            - containerPort: 4000
              name: backend
              protocol: TCP

          # Environment variables loaded from Kubernetes secret (must be created)
          env:
            - name: NODE_ENV
              value: 'development'
            - name: SKIP_BUILD
              value: 'true'
            - name: SKIP_INSTALL
              value: 'true'

            - name: SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SERVER_PORT
            - name: CLIENT_PORT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: CLIENT_PORT
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: LOG_LEVEL

            - name: PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: PUBLIC_URL
            - name: CLIENT_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: CLIENT_URL
            - name: SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SERVER_URL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: JWT_SECRET

            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_DATABASE
            - name: POSTGRES_SSL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_SSL

            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: ANTHROPIC_API_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENROUTER_API_KEY
            - name: DEFAULT_LLM_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DEFAULT_LLM_PROVIDER
            - name: DEFAULT_CHAT_MODEL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DEFAULT_CHAT_MODEL

            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_PUBLISHABLE_KEY

            - name: GA_MEASUREMENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GA_MEASUREMENT_ID

          # Resource requests/limits
          resources:
            requests:
              memory: '512Mi'
              cpu: '250m'
            limits:
              memory: '2Gi'
              cpu: '1000m'

      # NOTE: No persistentVolumeClaim volumes here because DB is external (EC2 + EBS)
