#cloud-config
# Bootstraps a starship EC2 box: installs Docker, prepares the shared work dir,
# blocks the instance metadata endpoint from the sandbox bridge, and starts the
# stack. Pinned images are expected in a registry; set them in /opt/starships/.env.
package_update: true
packages:
  - docker.io
  - docker-compose-plugin
  - awscli

write_files:
  - path: /etc/systemd/system/starships.service
    content: |
      [Unit]
      Description=Starships stack
      Requires=docker.service
      After=docker.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/starships
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - mkdir -p /opt/starships /var/starships/work
  - chmod 1777 /var/starships/work
  # Block the EC2 metadata endpoint from the docker bridge so cloned/agent code
  # in the sandbox cannot steal the instance role. (Adjust bridge subnet to match.)
  - iptables -I DOCKER-USER -d 169.254.169.254 -j DROP || true
  # Place docker-compose.yml, Caddyfile and .env in /opt/starships before enabling.
  - systemctl enable starships.service
