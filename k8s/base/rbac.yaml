apiVersion: v1
kind: ServiceAccount
metadata:
  name: starships-sa
  namespace: starships-ai
  labels:
    app: starships-ai

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: starships-role
  namespace: starships-ai
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: starships-rolebinding
  namespace: starships-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: starships-role
subjects:
- kind: ServiceAccount
  name: starships-sa
  namespace: starships-ai