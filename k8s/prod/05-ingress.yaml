apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starships-ingress
  namespace: starships-prod
  annotations:
    # SSL
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    
    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "starships-service"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-set-headers: "starships-prod/custom-headers"
    
    # Performance (matching dev)
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - starships.ai
    - www.starships.ai
    secretName: starships-tls-cert
  rules:
  - host: starships.ai
    http:
      paths:
      - path: /_next
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 3000
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 3000
      - path: /socket.io
        pathType: ImplementationSpecific
        backend:
          service:
            name: starships-service
            port:
              number: 4000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 3000
  - host: www.starships.ai
    http:
      paths:
      - path: /_next
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 3000
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 3000
      - path: /socket.io
        pathType: ImplementationSpecific
        backend:
          service:
            name: starships-service
            port:
              number: 4000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 3000