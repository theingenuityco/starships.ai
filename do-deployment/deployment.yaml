apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-app
  namespace: starships-prod
  labels:
    app: starships-ai
spec:
  replicas: 1  # Single replica for MVP
  selector:
    matchLabels:
      app: starships-ai
  template:
    metadata:
      labels:
        app: starships-ai
    spec:
      containers:
      - name: starships
        image: [DOCKER-REGISTRY-URL]:fix-docker-build
        imagePullPolicy: Always
        command: ["/bin/sh"]
        args: ["-c", "cd /app/packages/client && NEXT_PUBLIC_ENABLE_AUTH_TESTING_BACKDOOR=true npx next start"]
        ports:
        - containerPort: 3000
          name: frontend
        - containerPort: 4000
          name: backend
        - containerPort: 7474
          name: neo4j-http
        - containerPort: 7687
          name: neo4j-bolt
        envFrom:
        - secretRef:
            name: starships-secrets
        env:
        - name: NODE_ENV
          value: "production"
        - name: SKIP_BUILD
          value: "true"
        - name: NEO4J_URI
          value: "[NEO4J-LOCAL-URL]"
        - name: NEO4J_USERNAME
          value: "neo4j"
        - name: NEO4J_PASSWORD
          value: "[DEFAULT-PASSWORD]"
        - name: SKIP_INSTALL
          value: "true"
        - name: CLIENT_URL
          value: "http://[HARDCODED-IP]"
        - name: NEXT_PUBLIC_API_URL
          value: "http://[HARDCODED-IP]:4000"
        - name: SERVER_URL
          value: "http://localhost:4000"
        - name: NEXT_PUBLIC_ENABLE_AUTH_TESTING_BACKDOOR
          value: "true"
        - name: KINDE_CLIENT_ID
          value: "test_client_id"
        - name: KINDE_CLIENT_SECRET
          value: "test_client_secret"
        - name: KINDE_ISSUER_URL
          value: "https://[KINDE-TEST-DOMAIN]"
        - name: KINDE_SITE_URL
          value: "http://[HARDCODED-IP]"
        - name: KINDE_POST_LOGIN_REDIRECT_URL
          value: "http://[HARDCODED-IP]/fleet"
        - name: KINDE_POST_LOGOUT_REDIRECT_URL
          value: "http://[HARDCODED-IP]"
        resources:
          requests:
            memory: "1Gi"    # Minimum guaranteed
            cpu: "500m"      
          limits:
            memory: "3Gi"    # Increased for Neo4j
            cpu: "1500m"     
        volumeMounts:
        - name: neo4j-data
          mountPath: /var/lib/neo4j/data
        - name: app-sessions
          mountPath: /app/data/sessions
      imagePullSecrets:
      - name: ghcr-pull-secret
      volumes:
      - name: neo4j-data
        persistentVolumeClaim:
          claimName: neo4j-data-pvc
      - name: app-sessions
        persistentVolumeClaim:
          claimName: sessions-pvc