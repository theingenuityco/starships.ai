apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: starships-prod
  labels:
    app: postgres
    environment: production
spec:
  type: ClusterIP
  selector:
    app: postgres
    environment: production
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: starships-prod
  labels:
    app: postgres
    environment: production
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      environment: production
  template:
    metadata:
      labels:
        app: postgres
        environment: production
    spec:
      initContainers:
        - name: migrate-postgres-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e

              # If the new volume already contains an initialized cluster, do nothing
              if [ -f /new/data/pgdata/postgresql.conf ] && [ -f /new/data/pgdata/PG_VERSION ]; then
                echo "New Postgres data already initialized; skipping migration."
                exit 0
              fi

              echo "Scanning /old for existing Postgres cluster..."
              # Prefer the known path from the previous "fat container" layout, if present.
              # (Using `find ... | head -n 1` is not safe because it can accidentally match
              # stray PG_VERSION files under `base/<oid>/...`, which is not the cluster root.)
              OLD_CLUSTER_DIR=""
              for CANDIDATE in /old/postgres/data/pgdata /old/var/lib/postgresql/data/pgdata /old/var/lib/postgresql/data; do
                if [ -f "$CANDIDATE/PG_VERSION" ] && [ -d "$CANDIDATE/base" ] && [ -d "$CANDIDATE/global" ]; then
                  OLD_CLUSTER_DIR="$CANDIDATE"
                  break
                fi
              done

              if [ -z "$OLD_CLUSTER_DIR" ]; then
                OLD_PG_VERSION_PATH=$(find /old -maxdepth 10 -type f -name PG_VERSION 2>/dev/null | head -n 1 || true)
                if [ -n "$OLD_PG_VERSION_PATH" ]; then
                  DIR=$(dirname "$OLD_PG_VERSION_PATH")
                  # Walk upward until we find the actual cluster root (contains base/ + global/ + PG_VERSION).
                  while [ "$DIR" != "/old" ] && [ "$DIR" != "/" ]; do
                    if [ -f "$DIR/PG_VERSION" ] && [ -d "$DIR/base" ] && [ -d "$DIR/global" ]; then
                      OLD_CLUSTER_DIR="$DIR"
                      break
                    fi
                    DIR=$(dirname "$DIR")
                  done
                fi
              fi

              if [ -z "$OLD_CLUSTER_DIR" ]; then
                echo "No existing Postgres cluster found under /old; skipping migration."
                exit 0
              fi

              echo "Found existing Postgres cluster at $OLD_CLUSTER_DIR"

              echo "Copying existing Postgres data from old volume to new volume..."
              rm -rf /new/data/pgdata.new
              mkdir -p /new/data/pgdata.new
              cp -a "$OLD_CLUSTER_DIR/." /new/data/pgdata.new/.
              if [ ! -f /new/data/pgdata.new/PG_VERSION ] || [ ! -f /new/data/pgdata.new/postgresql.conf ]; then
                echo "Migration failed: copied directory is missing expected cluster root files (PG_VERSION/postgresql.conf)."
                echo "Refusing to replace /new/data/pgdata."
                exit 1
              fi
              rm -rf /new/data/pgdata
              mv /new/data/pgdata.new /new/data/pgdata
              # Ensure the postgres container user can read/write the data directory.
              chown -R 70:70 /new/data/pgdata
              echo "Postgres data copy complete."
          volumeMounts:
            - name: old-postgres-data
              mountPath: /old
            - name: postgres-data
              mountPath: /new/data
              subPath: postgres
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            # Use the same credentials and database name as the application
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PASSWORD
            # Ensure PGDATA matches the in-container path used by the fat container
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            requests:
              cpu: '500m'
              memory: '1Gi'
            limits:
              cpu: '2000m'
              memory: '4Gi'
      volumes:
        # Old PVC from starships-app; used only for one-time data migration
        - name: old-postgres-data
          persistentVolumeClaim:
            claimName: starships-data-starships-app-0
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 30Gi
