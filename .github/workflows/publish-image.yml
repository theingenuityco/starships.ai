name: Build and Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Only run on main branch pushes or merged PRs
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-latest: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert repository name to lowercase (GHCR requires lowercase)
      - name: Convert IMAGE_NAME to lowercase
        run: |
          echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss' tz='UTC'}},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ github.sha }}

      - name: Generate image digest
        id: digest
        run: |
          # Wait a moment for the image to be fully available
          sleep 5
          
          # Try to get the digest, filtering out any extra output
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest 2>/dev/null | grep -oP 'Digest:\s*\K[^\s]+' | head -1 || echo "")
          
          # If that didn't work, try the format approach
          if [ -z "$DIGEST" ]; then
            DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest --format '{{.Manifest.Digest}}' 2>/dev/null | head -1 || echo "")
          fi
          
          # Default to unknown if we still don't have it
          if [ -z "$DIGEST" ]; then
            DIGEST="unknown"
          fi
          
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "Found digest: ${DIGEST}"

      - name: Image scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Create deployment summary
        run: |
          echo "## 🚀 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME_LOWER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.digest.outputs.digest }}" != "unknown" ]; then
            echo "**Digest:** \`${{ steps.digest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Info" >> $GITHUB_STEP_SUMMARY
          echo "- Multi-platform image: linux/amd64 and linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "- Contains: Frontend, Backend, and Neo4j database" >> $GITHUB_STEP_SUMMARY
          echo "- Flexible Neo4j: Supports internal or external (Aura)" >> $GITHUB_STEP_SUMMARY

      - name: (Optional) Trigger RunPod Redeploy
        if: ${{ success() && vars.RUNPOD_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ vars.RUNPOD_WEBHOOK_URL }}" \
            -H "Authorization: ${{ secrets.RUNPOD_AUTH_HEADER }}" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest",
              "digest": "${{ steps.digest.outputs.digest }}"
            }'
        continue-on-error: true

  # NEW: Deploy to DigitalOcean
  deploy-to-digitalocean:
    name: Deploy to DigitalOcean Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only deploy on main branch
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      
      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save starships-prod
      
      - name: Update deployment with new image
        run: |
          # Update the deployment with the new image
          kubectl set image deployment/starships-all \
            starships=${{ needs.build-and-push.outputs.image-latest }} \
            -n starships-prod
          
          echo "Updated deployment to use image: ${{ needs.build-and-push.outputs.image-latest }}"
      
      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/starships-all \
            -n starships-prod \
            --timeout=600s
      
      - name: Verify deployment
        run: |
          echo "## 🚢 DigitalOcean Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get pod status
          kubectl get pods -n starships-prod -l app=starships-all
          
          # Get the load balancer IP
          LB_IP=$(kubectl get service starships-lb -n starships-prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          
          echo "**Application URL:** http://$LB_IP" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Health:** http://$LB_IP:4000/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Test the health endpoint
          sleep 30
          if curl -f http://$LB_IP:4000/health -m 10; then
            echo "✅ Health check passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Health check failed (may need more time to start)" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed, rolling back..."
          kubectl rollout undo deployment/starships-all -n starships-prod
          kubectl rollout status deployment/starships-all -n starships-prod --timeout=300s