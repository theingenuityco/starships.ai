apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starships-ingress
  namespace: starships-ai
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-port: "4000"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: ${ACM_CERTIFICATE_ARN}
    # Enable sticky sessions for WebSocket support
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400
spec:
  rules:
  - host: starships.yourdomain.com  # Replace with your domain
    http:
      paths:
      # Frontend routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 3000
      # Backend API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 4000
      # WebSocket routes
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 4000
      # Neo4j Browser (optional, for development)
      - path: /neo4j
        pathType: Prefix
        backend:
          service:
            name: starships-service
            port:
              number: 7474