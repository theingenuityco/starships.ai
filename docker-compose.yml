version: '3.8'

services:
  # All-in-One Container: Frontend + Backend + PostgreSQL (configurable)
  starships:
    image: ghcr.io/theingenuityco/starships.ai:latest
    container_name: starships-all-in-one
    restart: unless-stopped
    ports:
      - '3000:3000' # Frontend (Next.js)
      - '4000:4000' # Backend (Express)
      - '5432:5432' # PostgreSQL (only if using internal PostgreSQL)
    environment:
      # Core Configuration
      NODE_ENV: production
      SERVER_PORT: ${SERVER_PORT:-4000}
      CLIENT_PORT: ${CLIENT_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # URLs
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SERVER_URL: ${SERVER_URL:-http://localhost:4000}

      # PostgreSQL Configuration - Choose ONE of the following options:

      # Option 1: Use INTERNAL PostgreSQL (default - runs PostgreSQL inside container)
      # Leave POSTGRES_EXTERNAL_HOST unset or empty
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost} # Will be auto-set if using internal
      # Option 2: Use EXTERNAL PostgreSQL (e.g., AWS RDS, Google Cloud SQL)
      # Uncomment and set the following to use external PostgreSQL:
      # POSTGRES_EXTERNAL_HOST: your-postgres-host.com
      # POSTGRES_PORT: 5432

      # PostgreSQL Credentials (for both internal and external)
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-starships}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}

      # Authentication
      JWT_SECRET: ${JWT_SECRET:-your-super-secure-jwt-secret-key-at-least-32-characters-long}

      # LLM Provider Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-gpt-4o}

      # Stripe Configuration
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # Analytics
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID}

    volumes:
      # Application data
      - starships-data:/app/data

      # PostgreSQL data (only used if internal PostgreSQL is active)
      - postgres-data:/var/lib/postgresql/data

      # Cache for faster restarts
      - node-modules:/app/node_modules
      - client-next-cache:/app/packages/client/.next
      - server-dist-cache:/app/packages/server/dist

    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000 && wget -q --spider http://localhost:4000/health']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s # 2 minutes for PostgreSQL startup + build

    networks:
      - starships-network

volumes:
  # Application volumes
  starships-data:
    driver: local

  # PostgreSQL volumes (only used with internal PostgreSQL)
  postgres-data:
    driver: local

  # Cache volumes
  node-modules:
    driver: local
  client-next-cache:
    driver: local
  server-dist-cache:
    driver: local

networks:
  starships-network:
    driver: bridge
