apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starships-app
  namespace: starships-dev
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # TODO: Replace ACM_CERT_ID with your actual ACM Certificate ID
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:577012215849:certificate/ACM_CERT_ID
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/success-codes: '200,301,302'

spec:
  ingressClassName: alb
  rules:
    - host: dev.starships.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: starships-app
                port:
                  name: frontend
  tls:
    - hosts:
        - dev.starships.ai
      secretName: starships-tls
