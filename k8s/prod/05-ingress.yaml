apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starships-app
  namespace: starships-prod
  labels:
    app: starships-ai
  annotations:
    # AWS Load Balancer Controller
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'

    # SSL Certificate - REPLACE WITH YOUR CERT ARN
    # Get from: aws acm list-certificates --region ap-south-1
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:577012215849:certificate/ea27c874-dbb4-4c0c-8cf6-113a8de7a40d
    alb.ingress.kubernetes.io/ssl-redirect: '443'

    # Health checks (shared across target groups)
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: 'traffic-port'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/success-codes: '200'

    # Timeouts (important for SSE streaming)
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600

    # Target group settings
    alb.ingress.kubernetes.io/target-group-attributes: |
      deregistration_delay.timeout_seconds=30,
      stickiness.enabled=false

    # Tags
    alb.ingress.kubernetes.io/tags: Environment=production,Project=starships

    # Canonical host redirect: send all www -> apex (preserve path/query)
    alb.ingress.kubernetes.io/actions.redirect-to-apex: >
      {"Type":"redirect","RedirectConfig":{"Host":"starships.ai","Path":"/#{path}","Query":"#{query}","Protocol":"HTTPS","Port":"443","StatusCode":"HTTP_301"}}

    # Redirect app-owned routes on apex -> app subdomain
    alb.ingress.kubernetes.io/actions.redirect-to-app: >
      {"Type":"redirect","RedirectConfig":{"Host":"app.starships.ai","Path":"/#{path}","Query":"#{query}","Protocol":"HTTPS","Port":"443","StatusCode":"HTTP_301"}}

    # Redirect docs path on apex -> docs subdomain (legacy /docs/* links)
    alb.ingress.kubernetes.io/actions.redirect-to-docs: >
      {"Type":"redirect","RedirectConfig":{"Host":"docs.starships.ai","Path":"/#{path}","Query":"#{query}","Protocol":"HTTPS","Port":"443","StatusCode":"HTTP_301"}}

spec:
  ingressClassName: alb
  rules:
    # starships.ai
    - host: starships.ai
      http:
        paths:
          # Docs (must be first)
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: redirect-to-docs
                port:
                  name: use-annotation

          # App-owned routes (redirect to app.starships.ai)
          - path: /ship
            pathType: Prefix
            backend:
              service:
                name: redirect-to-app
                port:
                  name: use-annotation
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: redirect-to-app
                port:
                  name: use-annotation
          - path: /account
            pathType: Prefix
            backend:
              service:
                name: redirect-to-app
                port:
                  name: use-annotation
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: redirect-to-app
                port:
                  name: use-annotation
          - path: /forgot-password
            pathType: Prefix
            backend:
              service:
                name: redirect-to-app
                port:
                  name: use-annotation
          - path: /reset-password
            pathType: Prefix
            backend:
              service:
                name: redirect-to-app
                port:
                  name: use-annotation
          - path: /accept-invite
            pathType: Prefix
            backend:
              service:
                name: redirect-to-app
                port:
                  name: use-annotation
          - path: /onboarding
            pathType: Prefix
            backend:
              service:
                name: redirect-to-app
                port:
                  name: use-annotation
          - path: /pwa
            pathType: Prefix
            backend:
              service:
                name: redirect-to-app
                port:
                  name: use-annotation

          # Frontend (catch-all, last)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: starships-app
                port:
                  number: 3000

    # app.starships.ai
    - host: app.starships.ai
      http:
        paths:
          # App frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: starships-webapp
                port:
                  number: 3000

    # api.starships.ai
    - host: api.starships.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: starships-app
                port:
                  number: 4000

    # docs.starships.ai
    - host: docs.starships.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: starships-app
                port:
                  number: 3001

    # www.starships.ai
    - host: www.starships.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redirect-to-apex
                port:
                  name: use-annotation
