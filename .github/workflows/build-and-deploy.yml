name: Build and Deploy to Dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip build and only deploy'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: theingenuityco/starships.ai

permissions:
  contents: write
  packages: write
  id-token: write
  issues: write
  pull-requests: read
  actions: read

jobs:
  # Calculate semantic version to determine if dev build should proceed
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      should_build: ${{ steps.build_decision.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm --version
          # Configure pnpm to use the official npm registry
          pnpm config set registry https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install

      - name: Calculate Semantic Version
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # For main branch, actually create the release
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] && [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Running semantic-release to create version..."
            npx semantic-release > semantic-output.txt 2>&1 || true
            
            if grep -q "Published release" semantic-output.txt; then
              NEXT_VERSION=$(grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' semantic-output.txt)
              echo "✅ Published new version: ${NEXT_VERSION}"
              echo "new_release_published=true" >> $GITHUB_OUTPUT
              echo "new_release_version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
            else
              echo "ℹ️ No new version needed - skipping build and deploy"
              echo "new_release_published=false" >> $GITHUB_OUTPUT
              echo "new_release_version=" >> $GITHUB_OUTPUT
            fi
          else
            # For other branches or manual runs, just check what would be published
            npx semantic-release --dry-run > semantic-output.txt 2>&1 || true
            
            if grep -q "The next release version is" semantic-output.txt; then
              NEXT_VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' semantic-output.txt)
              echo "Next version would be: ${NEXT_VERSION}"
              echo "new_release_published=true" >> $GITHUB_OUTPUT
              echo "new_release_version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
            else
              echo "No new version would be published"
              echo "new_release_published=false" >> $GITHUB_OUTPUT
              echo "new_release_version=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Determine build decision
        id: build_decision
        run: |
          # Build should proceed ONLY if:
          # 1. New release was published (semantic version created), OR
          # 2. Manual workflow dispatch (allows override)
          if [[ "${{ steps.semantic.outputs.new_release_published }}" == "true" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Build will proceed"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏭️ Build skipped - no new version created"
          fi

  # Development Build and Deploy (triggered on semantic version or manual override)
  build-dev:
    name: Build Dev Image
    runs-on: ubuntu-latest
    needs: [calculate-version]
    if: |
      needs.calculate-version.outputs.should_build == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build != 'true')
      )
    environment: dev
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.calculate-version.outputs.new_release_version }},enable=${{ needs.calculate-version.outputs.new_release_published == 'true' }}
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Dev Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ''
          cache-to: ''
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=dev-${{ github.sha }}
            ENVIRONMENT=development
            CACHE_BUST=${{ github.run_number }}
          secrets: |
            stripe_secret_key=${{ secrets.STRIPE_SECRET_KEY }}
            stripe_publishable_key=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            kinde_client_id=${{ secrets.KINDE_CLIENT_ID }}
            kinde_client_secret=${{ secrets.KINDE_CLIENT_SECRET }}
            kinde_issuer_url=${{ vars.KINDE_ISSUER_URL }}
            kinde_site_url=${{ vars.KINDE_SITE_URL }}
            kinde_post_login_redirect_url=${{ vars.KINDE_POST_LOGIN_REDIRECT_URL }}
            kinde_post_logout_redirect_url=${{ vars.KINDE_POST_LOGOUT_REDIRECT_URL }}
            next_public_api_url=${{ vars.NEXT_PUBLIC_API_URL }}
            next_public_server_url=${{ vars.NEXT_PUBLIC_SERVER_URL }}

  # REMOVED: Production build job - we now use the same image as dev
  # Production deployments are handled manually via deploy-production.yml
  # using the same image tags that were tested in dev

  # Deploy to Development
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [calculate-version, build-dev]
    if: |
      needs.calculate-version.outputs.should_build == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch'
      )
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Setup Kubernetes
        run: |
          doctl kubernetes cluster kubeconfig save starships-dev
          kubectl config use-context do-nyc1-starships-dev

      - name: Update Kubernetes secrets
        run: |
          # Delete existing secrets if they exist
          kubectl delete secret starships-secrets -n starships-dev --ignore-not-found=true
          kubectl delete secret kinde-auth-secret -n starships-dev --ignore-not-found=true
          
          # Create new secrets from GitHub secrets
          kubectl create secret generic starships-secrets \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --from-literal=STRIPE_PUBLISHABLE_KEY="${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
            --from-literal=NEO4J_PASSWORD="${{ secrets.NEO4J_PASSWORD }}" \
            --from-literal=KINDE_SITE_URL="${{ secrets.KINDE_SITE_URL }}" \
            --from-literal=KINDE_POST_LOGIN_REDIRECT_URL="${{ secrets.KINDE_POST_LOGIN_REDIRECT_URL }}" \
            --from-literal=KINDE_POST_LOGOUT_REDIRECT_URL="${{ secrets.KINDE_POST_LOGOUT_REDIRECT_URL }}" \
            --from-literal=KINDE_REDIRECT_URL="${{ secrets.KINDE_REDIRECT_URL }}" \
            --from-literal=KINDE_COOKIE_DOMAIN="${{ secrets.KINDE_COOKIE_DOMAIN }}" \
            --from-literal=CLIENT_URL="${{ secrets.CLIENT_URL }}" \
            --from-literal=NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
            --from-literal=NEXT_PUBLIC_SERVER_URL="${{ secrets.NEXT_PUBLIC_SERVER_URL }}" \
            -n starships-dev
          
          kubectl create secret generic kinde-auth-secret \
            --from-literal=KINDE_CLIENT_ID="${{ secrets.KINDE_CLIENT_ID }}" \
            --from-literal=KINDE_CLIENT_SECRET="${{ secrets.KINDE_CLIENT_SECRET }}" \
            --from-literal=KINDE_ISSUER_URL="${{ secrets.KINDE_ISSUER_URL }}" \
            -n starships-dev
          
          # Create GitHub registry secret using persistent PAT
          kubectl delete secret ghcr-pull-secret -n starships-dev --ignore-not-found=true
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=dewangsolanki3 \
            --docker-password="${{ secrets.GHCR_PULL_TOKEN }}" \
            -n starships-dev
          
          echo "✅ Dev secrets updated successfully"

      - name: Update image in deployment
        run: |
          # Use the semantic version tag
          IMAGE_TAG="${{ needs.calculate-version.outputs.new_release_version }}"
          
          echo "📦 Deploying version: ${IMAGE_TAG}"
          kubectl set image deployment/starships-app \
            starships=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -n starships-dev
          
          # Wait for rollout
          kubectl rollout status deployment/starships-app -n starships-dev --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n starships-dev
          kubectl logs -n starships-dev deployment/starships-app --tail=50 | grep "Server running" || true

  # PRODUCTION DEPLOYMENT REMOVED
  # Production deployments are now handled manually via deploy-production.yml workflow
  # This ensures production deployments are intentional and controlled
  # Use the same image tags that were tested in dev (no prod- prefix needed)

  # Workflow Summary (runs always to provide feedback)
  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [calculate-version]
    if: always() && needs.calculate-version.result != 'skipped'
    steps:
      - name: Create workflow summary
        run: |
          echo "## 🔄 Build and Deploy Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.calculate-version.outputs.new_release_published }}" == "true" ]]; then
            echo "✅ **Semantic Version Check:** New version detected (\`${{ needs.calculate-version.outputs.new_release_version }}\`)" >> $GITHUB_STEP_SUMMARY
            echo "🏗️ **Build Status:** Development build proceeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Semantic Version Check:** No new version detected" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "🔧 **Build Status:** Manual override triggered" >> $GITHUB_STEP_SUMMARY
            else
              echo "⏭️ **Build Status:** Development build skipped (no meaningful changes)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY