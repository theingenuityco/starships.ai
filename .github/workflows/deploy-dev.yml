name: Deploy to Development (AWS EKS)

on:
  workflow_run:
    workflows: ['Build and Push Image']
    types:
      - completed
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: theingenuityco/starships.ai
  AWS_REGION: ap-south-1
  EKS_CLUSTER: starships-dev
  NAMESPACE: starships-dev

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  deploy-dev:
    name: Deploy Image to EKS (Dev)
    runs-on: ubuntu-latest
    environment: dev

    # Run when build workflow succeeded, or when dispatched manually
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tag
        id: get-image
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$SHA" ]; then
            IMAGE_TAG="latest"
          else
            SHORT_SHA=$(echo "$SHA" | cut -c1-7)
            IMAGE_TAG="sha-${SHORT_SHA}"
          fi
          echo "Using image tag: ${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists
        id: check-image
        run: |
          IMAGE_TAG="${{ steps.get-image.outputs.image_tag }}"
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          echo "Checking if image exists: ${IMAGE_URL}"

          # Check if the image manifest exists
          if docker manifest inspect "${IMAGE_URL}" > /dev/null 2>&1; then
            echo "✅ Image found: ${IMAGE_URL}"
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Image does not exist: ${IMAGE_URL}"
            echo "ℹ️  This typically happens when semantic-release skipped the build (e.g., docs/chore commits)"
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deployment if no image
        if: steps.check-image.outputs.image_exists != 'true'
        run: |
          echo "⏭️  Skipping deployment - no new image was built"
          echo "This is expected for commits that don't trigger a release (docs, chore, etc.)"
          exit 0

      - name: Configure AWS credentials
        if: steps.check-image.outputs.image_exists == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        if: steps.check-image.outputs.image_exists == 'true'
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Validate manifests
        if: steps.check-image.outputs.image_exists == 'true'
        run: |
          kubectl apply --dry-run=client -f k8s/dev/00-namespace.yaml
          kubectl apply --dry-run=client -f k8s/dev/02-pvc.yaml
          kubectl apply --dry-run=client -f k8s/dev/03-deployment.yaml
          kubectl apply --dry-run=client -f k8s/dev/04-service.yaml
          kubectl apply --dry-run=client -f k8s/dev/05-ingress.yaml
          # RBAC for k8s job runner was removed
          kubectl apply --dry-run=client -f k8s/dev/07-autopilot-runner-networkpolicy.yaml
          kubectl apply --dry-run=client -f k8s/dev/08-autopilot-runner-deployment.yaml
          kubectl apply --dry-run=client -f k8s/dev/09-autopilot-runner-service.yaml
          echo "✅ Kubernetes manifests validated successfully."

      - name: Apply manifests
        if: steps.check-image.outputs.image_exists == 'true'
        run: |
          kubectl apply -f k8s/dev/00-namespace.yaml
          kubectl apply -f k8s/dev/02-pvc.yaml
          kubectl apply -f k8s/dev/03-deployment.yaml
          kubectl apply -f k8s/dev/04-service.yaml
          kubectl apply -f k8s/dev/05-ingress.yaml
          # RBAC for k8s job runner was removed
          kubectl apply -f k8s/dev/07-autopilot-runner-networkpolicy.yaml
          kubectl apply -f k8s/dev/08-autopilot-runner-deployment.yaml
          kubectl apply -f k8s/dev/09-autopilot-runner-service.yaml
          echo "✅ Applied manifests to dev cluster."

      - name: Update secrets
        if: steps.check-image.outputs.image_exists == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_SSL: ${{ secrets.POSTGRES_SSL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SERVER_URL: ${{ vars.SERVER_URL }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          DOCS_URL: ${{ vars.DOCS_URL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          USERBACK_TOKEN: ${{ secrets.USERBACK_TOKEN }}
          SENTRY_DSN_CLIENT: ${{ secrets.SENTRY_DSN_CLIENT }}
          SENTRY_DSN_SERVER: ${{ secrets.SENTRY_DSN_SERVER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RUNNER_AUTH_TOKEN: ${{ secrets.RUNNER_AUTH_TOKEN }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          AWS_SES_REGION: ${{ vars.AWS_SES_REGION }}
        run: |
          kubectl delete secret starships-secrets -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl create secret generic starships-secrets \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            --from-literal=STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            --from-literal=STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
            --from-literal=GH_OAUTH_CLIENT_ID="${GH_OAUTH_CLIENT_ID}" \
            --from-literal=GH_OAUTH_CLIENT_SECRET="${GH_OAUTH_CLIENT_SECRET}" \
            --from-literal=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --from-literal=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            --from-literal=STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            --from-literal=POSTGRES_HOST="$POSTGRES_HOST" \
            --from-literal=POSTGRES_PORT="$POSTGRES_PORT" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DATABASE="$POSTGRES_DATABASE" \
            --from-literal=POSTGRES_SSL="$POSTGRES_SSL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=ENCRYPTION_KEY="$ENCRYPTION_KEY" \
            --from-literal=SERVER_URL="$SERVER_URL" \
            --from-literal=CLIENT_URL="$CLIENT_URL" \
            --from-literal=PUBLIC_URL="$PUBLIC_URL" \
            --from-literal=DOCS_URL="$DOCS_URL" \
            --from-literal=GA_MEASUREMENT_ID="$GA_MEASUREMENT_ID" \
            --from-literal=USERBACK_TOKEN="$USERBACK_TOKEN" \
            --from-literal=SENTRY_DSN_CLIENT="$SENTRY_DSN_CLIENT" \
            --from-literal=SENTRY_DSN_SERVER="$SENTRY_DSN_SERVER" \
            --from-literal=RUNNER_AUTH_TOKEN="$RUNNER_AUTH_TOKEN" \
            --from-literal=EMAIL_FROM_ADDRESS="$EMAIL_FROM_ADDRESS" \
            --from-literal=EMAIL_FROM_NAME="$EMAIL_FROM_NAME" \
            --from-literal=AWS_SES_REGION="$AWS_SES_REGION" \
            -n ${{ env.NAMESPACE }}

          kubectl delete secret ghcr-pull-secret -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.repository_owner }} \
            --docker-password="$GHCR_PULL_TOKEN" \
            -n ${{ env.NAMESPACE }}
          echo "✅ Secrets updated successfully."

      - name: Deploy new image
        if: steps.check-image.outputs.image_exists == 'true'
        run: |
          echo "Deploying image tag: ${{ steps.get-image.outputs.image_tag }}"
          kubectl set image statefulset/starships-app \
            starships=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get-image.outputs.image_tag }} \
            -n ${{ env.NAMESPACE }}
          # Force rollout restart to pull latest image (needed when using 'latest' tag)
          kubectl rollout restart statefulset/starships-app -n ${{ env.NAMESPACE }}
          kubectl rollout status statefulset/starships-app -n ${{ env.NAMESPACE }} --timeout=600s
          echo "✅ Deployment rolled out successfully."

      - name: Verify deployment
        if: steps.check-image.outputs.image_exists == 'true'
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get pv,pvc -n ${{ env.NAMESPACE }} || true
          kubectl logs -n ${{ env.NAMESPACE }} statefulset/starships-app --tail=30 || true
          echo "✅ Verification complete."
