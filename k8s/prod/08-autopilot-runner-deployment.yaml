apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot-runner
  namespace: starships-prod
  labels:
    app: autopilot-runner
    environment: production
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: autopilot-runner
      environment: production
  template:
    metadata:
      labels:
        app: autopilot-runner
        environment: production
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: autopilot-runner
          image: ghcr.io/theingenuityco/autopilot-runner:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: RUNNER_PORT
              value: '50051'
            - name: RUNNER_CONCURRENCY
              value: '8'
            - name: RUNNER_FASTPATH_ENABLED
              value: 'true'
            - name: RUNNER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: RUNNER_AUTH_TOKEN
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENROUTER_API_KEY
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
