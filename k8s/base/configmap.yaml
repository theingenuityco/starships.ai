apiVersion: v1
kind: ConfigMap
metadata:
  name: starships-config
  namespace: starships-ai
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "http://starships-service:4000"
  NEXT_PUBLIC_WS_URL: "ws://starships-service:4000"
  # Neo4j Configuration - Using internal Neo4j by default
  # To use external Neo4j (like Aura), set NEO4J_EXTERNAL_URI in secrets
  NEO4J_URI: "bolt://localhost:7687"
  NEO4J_DATABASE: "neo4j"
  NEO4J_USERNAME: "neo4j"