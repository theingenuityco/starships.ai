name: Redeploy to RunPod

on:
  workflow_run:
    workflows: ["Build and Publish Docker Image"]
    types:
      - completed
  workflow_dispatch:

jobs:
  notify-runpod:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Notify RunPod via Webhook
        env:
          RUNPOD_ENDPOINT: ${{ secrets.RUNPOD_WEBHOOK_URL }}
          AUTH_HEADER: ${{ secrets.RUNPOD_AUTH_HEADER }}
        run: |
          curl -s -X POST "$RUNPOD_ENDPOINT" \
            -H "Authorization: $AUTH_HEADER" 