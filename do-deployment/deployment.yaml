apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-app
  namespace: starships-prod
  labels:
    app: starships-ai
spec:
  replicas: 1  # Single replica for MVP
  selector:
    matchLabels:
      app: starships-ai
  template:
    metadata:
      labels:
        app: starships-ai
    spec:
      containers:
      - name: starships
        image: [DOCKER-REGISTRY-URL]:2.0.0
        imagePullPolicy: Always
        command: ["/bin/sh"]
        args: 
        - "-c"
        - |
          echo "Starting production services (frontend only for MVP)..."
          # Start Neo4j
          $NEO4J_HOME/bin/neo4j start
          sleep 30
          # Start frontend only (backend has module issues)
          cd /app/packages/client && exec npx next start -p 3000
        ports:
        - containerPort: 3000
          name: frontend
        - containerPort: 4000
          name: backend
        - containerPort: 7474
          name: neo4j-http
        - containerPort: 7687
          name: neo4j-bolt
        envFrom:
        - secretRef:
            name: kinde-auth-secret
        env:
        - name: NODE_ENV
          value: "production"
        - name: SKIP_BUILD
          value: "true"
        - name: NEO4J_URI
          value: "[NEO4J-LOCAL-URL]"
        - name: NEO4J_USERNAME
          value: "neo4j"
        - name: NEO4J_PASSWORD
          value: "[DEFAULT-PASSWORD]"
        - name: SKIP_INSTALL
          value: "true"
        - name: CLIENT_URL
          value: "http://[HARDCODED-IP]"
        - name: NEXT_PUBLIC_API_URL
          value: "http://[HARDCODED-IP]:4000"
        - name: SERVER_URL
          value: "http://localhost:4000"
        - name: NEXT_PUBLIC_ENABLE_AUTH_TESTING_BACKDOOR
          value: "true"
        # Kinde vars - using localhost for testing
        # Update these to your actual domain when ready
        - name: KINDE_SITE_URL
          value: "http://localhost:8080"
        - name: KINDE_POST_LOGIN_REDIRECT_URL
          value: "http://localhost:8080/fleet"
        - name: KINDE_POST_LOGOUT_REDIRECT_URL
          value: "http://localhost:8080"
        # API keys (dummy for MVP, replace with real values later)
        - name: STRIPE_SECRET_KEY
          value: "sk_test_dummy_key_for_mvp"
        - name: STRIPE_PUBLISHABLE_KEY
          value: "pk_test_dummy_key_for_mvp"
        - name: OPENAI_API_KEY
          value: "sk-dummy-openai-key-for-mvp"
        - name: ANTHROPIC_API_KEY
          value: "sk-ant-dummy-key-for-mvp"
        resources:
          requests:
            memory: "512Mi"   # Reduced for MVP
            cpu: "250m"      
          limits:
            memory: "2Gi"    # For Neo4j
            cpu: "1000m"
        volumeMounts:
        - name: neo4j-data
          mountPath: /var/lib/neo4j/data
        - name: app-sessions
          mountPath: /app/data/sessions
      imagePullSecrets:
      - name: ghcr-pull-secret
      volumes:
      - name: neo4j-data
        persistentVolumeClaim:
          claimName: neo4j-data-pvc
      - name: app-sessions
        persistentVolumeClaim:
          claimName: sessions-pvc