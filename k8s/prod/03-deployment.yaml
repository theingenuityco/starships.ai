apiVersion: v1
kind: Service
metadata:
  name: starships-app-headless
  namespace: starships-prod
  labels:
    app: starships-ai
    environment: production
spec:
  clusterIP: None # Headless service for StatefulSet
  selector:
    app: starships-ai
    environment: production
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: starships-app
  namespace: starships-prod
  labels:
    app: starships-ai
    environment: production
spec:
  serviceName: starships-app-headless
  replicas: 1 # Single replica (proven in dev)
  revisionHistoryLimit: 5
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: starships-ai
      environment: production
  template:
    metadata:
      labels:
        app: starships-ai
        environment: production
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '4000'
    spec:
      terminationGracePeriodSeconds: 30 # Graceful shutdown

      imagePullSecrets:
        - name: ghcr-pull-secret

      # Init containers (from dev)
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "🔧 Fixing permissions..."
              mkdir -p /app/packages/docs/.source
              chmod -R 777 /app/packages/docs || true
              echo "✅ Permissions fixed"
          volumeMounts:
            - name: starships-data
              mountPath: /app/data
              subPath: app-data
            - name: starships-data
              mountPath: /app/packages/docs/.source
              subPath: docs-source

      containers:
        - name: starships
          image: 'ghcr.io/theingenuityco/starships.ai:latest' # Update via CI/CD
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
              name: frontend
            - containerPort: 3001
              name: docs
            - containerPort: 4000
              name: backend

          env:
            # Core Settings
            - name: NODE_ENV
              value: 'production' # Changed from 'development'
            - name: AUTOPILOT_RUNNER
              value: 'remote'
            - name: RUNNER_URL
              value: 'http://autopilot-runner.starships-prod.svc.cluster.local:50051'
            - name: RUNNER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: RUNNER_AUTH_TOKEN
            - name: SKIP_BUILD
              value: 'true'
            - name: SKIP_INSTALL
              value: 'true'

            # URLs
            - name: PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: PUBLIC_URL
            - name: CLIENT_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: CLIENT_URL
            - name: SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SERVER_URL
            - name: DOCS_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DOCS_URL

            # Auth
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: JWT_SECRET

            # PostgreSQL
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_DATABASE
            - name: POSTGRES_SSL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_SSL

            # LLM Providers
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: ANTHROPIC_API_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENROUTER_API_KEY

            # Stripe
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_PUBLISHABLE_KEY

            # Analytics
            - name: GA_MEASUREMENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GA_MEASUREMENT_ID
            - name: USERBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: USERBACK_TOKEN
            - name: SENTRY_DSN_CLIENT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SENTRY_DSN_CLIENT
            - name: SENTRY_DSN_SERVER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SENTRY_DSN_SERVER

            # OAuth (GitHub OAuth App for login)
            - name: GH_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GH_OAUTH_CLIENT_ID
            - name: GH_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GH_OAUTH_CLIENT_SECRET
            # GitHub App (used for GitHub connector)
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GITHUB_APP_PRIVATE_KEY_BASE64
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: LINKEDIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: LINKEDIN_CLIENT_ID
            - name: LINKEDIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: LINKEDIN_CLIENT_SECRET
            - name: GOOGLE_DRIVE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_DRIVE_CLIENT_ID
            - name: GOOGLE_DRIVE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_DRIVE_CLIENT_SECRET
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DISCORD_CLIENT_ID
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DISCORD_CLIENT_SECRET
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DISCORD_BOT_TOKEN

            # Email
            - name: EMAIL_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: EMAIL_FROM_ADDRESS
            - name: EMAIL_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: EMAIL_FROM_NAME
            - name: AWS_SES_REGION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_SES_REGION
            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_S3_BUCKET
            - name: AWS_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_S3_REGION
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: ENCRYPTION_KEY

          resources:
            requests:
              memory: '1Gi' # Guaranteed minimum
              cpu: '500m' # 0.5 cores guaranteed
            limits:
              memory: '6Gi' # Use 75% of node RAM (leave 2GB for OS/K8s)
              cpu: '1800m' # Use 90% of node CPU (leave 0.2 for system)
          # Production health checks (updated to use /api/health)
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5

          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30 # 5 minutes max

          # Volume mounts (same as dev)
          volumeMounts:
            - name: starships-data
              mountPath: /app/data
              subPath: app-data
            - name: starships-data
              mountPath: /app/packages/docs/.source
              subPath: docs-source

  # Volume claim templates (StatefulSet feature)
  volumeClaimTemplates:
    - metadata:
        name: starships-data
        labels:
          app: starships-ai
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 30Gi
