name: Security Checks

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  security-audit:
    name: Dependency Security Audit
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure pnpm
        run: |
          pnpm --version
          pnpm config set registry https://registry.npmjs.org

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --prod --audit-level=high || true

      - name: Check for critical vulnerabilities
        run: pnpm audit --audit-level=critical || true

  gitleaks:
    name: Secret Scanning
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{matrix.language}}'
          output: codeql-results
          upload: false

      - name: Check and display CodeQL results
        run: |
          if [ -f codeql-results/javascript.sarif ]; then
            echo "## 🔍 CodeQL Security Analysis Results"
            echo ""
            
            # Parse and display issues
            jq -r '.runs[].results[] | 
              "### \(if .level == "error" then "🔴 CRITICAL" elif .level == "warning" then "🟡 HIGH" else "🟢 INFO" end): \(.message.text)\n" +
              "**File:** \(.locations[0].physicalLocation.artifactLocation.uri)\n" +
              "**Line:** \(.locations[0].physicalLocation.region.startLine // "N/A")\n" +
              "**Rule:** \(.ruleId)\n" +
              "```\n\(.locations[0].physicalLocation.region.snippet.text // "Code snippet not available")\n```\n"
            ' codeql-results/javascript.sarif 2>/dev/null || echo "No issues found ✅"
            
            # Count issues by severity
            critical_count=$(jq '[.runs[].results[] | select(.level == "error")] | length' codeql-results/javascript.sarif)
            high_count=$(jq '[.runs[].results[] | select(.level == "warning")] | length' codeql-results/javascript.sarif)
            
            echo ""
            echo "## 📊 Summary"
            echo "- Critical Issues: $critical_count"
            echo "- High Issues: $high_count"
            
            if [ "$critical_count" -gt 0 ]; then
              echo ""
              echo "❌ Build failed due to critical security vulnerabilities"
              exit 1
            elif [ "$high_count" -gt 5 ]; then
              echo ""
              echo "⚠️ Warning: Multiple high severity issues detected. Consider fixing them."
            else
              echo ""
              echo "✅ Security check passed"
            fi
          else
            echo "✅ No CodeQL results file found - analysis may have been skipped"
          fi

      - name: Upload CodeQL results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-results
          path: codeql-results/
