# Single optimized deployment that runs all services in one pod
# This is the most resource-efficient approach for a single node
apiVersion: v1
kind: Service
metadata:
  name: starships-lb
  namespace: starships-prod
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    name: frontend
  - port: 4000
    targetPort: 4000
    name: backend
  selector:
    app: starships-all
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-all
  namespace: starships-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starships-all
  template:
    metadata:
      labels:
        app: starships-all
    spec:
      containers:
      - name: starships
        image: [DOCKER-REGISTRY-URL]:fix-docker-build
        command: ['/bin/sh', '-c']
        args:
        - |
          set -e
          echo "Starting Starships.ai All-in-One Production"
          
          # Fix import paths
          echo "Fixing import paths..."
          find /app/packages -name "*.js" -type f ! -path "*/node_modules/*" ! -path "*/.next/*" \
            -exec sed -i 's|@starships/\([^/]*\)/src/|@starships/\1/dist/|g' {} + 2>/dev/null || true
          
          # Start Neo4j
          echo "Starting Neo4j..."
          /opt/neo4j/bin/neo4j start
          
          # Wait for Neo4j
          for i in $(seq 1 30); do
            if curl -s http://localhost:7474/ > /dev/null 2>&1; then
              echo "Neo4j is ready!"
              break
            fi
            sleep 1
          done
          
          # Start backend
          echo "Starting backend..."
          cd /app/packages/server
          export NODE_PATH="/app/node_modules:/app/packages/server/node_modules"
          export SKIP_VECTOR_STORE=true
          export NEO4J_URI=[NEO4J-LOCAL-URL]
          export NEO4J_USERNAME=neo4j
          export NEO4J_PASSWORD=[DEFAULT-PASSWORD]
          PORT=4000 nohup node dist/index.js > /tmp/backend.log 2>&1 &
          
          # Wait for backend
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            sleep 1
          done
          
          # Start frontend (foreground)
          echo "Starting frontend..."
          cd /app/packages/client
          unset PORT
          exec npx next start -p 3000
        ports:
        - containerPort: 3000
          name: frontend
        - containerPort: 4000
          name: backend
        - containerPort: 7474
          name: neo4j-http
        - containerPort: 7687
          name: neo4j-bolt
        env:
        - name: NODE_ENV
          value: "production"
        - name: SERVER_URL
          value: "http://localhost:4000"
        envFrom:
        - secretRef:
            name: starships-secrets
        - secretRef:
            name: kinde-auth-secret
        - secretRef:
            name: domain-config
        volumeMounts:
        - name: neo4j-data
          mountPath: /var/lib/neo4j/data
        - name: sessions
          mountPath: /app/data/sessions
        resources:
          requests:
            memory: "1.5Gi"
            cpu: "1000m"
          limits:
            memory: "3Gi"
            cpu: "1800m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 5
      volumes:
      - name: neo4j-data
        persistentVolumeClaim:
          claimName: neo4j-data-pvc
      - name: sessions
        persistentVolumeClaim:
          claimName: sessions-pvc