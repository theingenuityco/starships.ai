apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starships-app-ingress
  namespace: starships-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '60'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - starships.ai
        - www.starships.ai
      secretName: starships-tls-cert
  rules:
    - host: starships.ai
      http:
        paths:
          # ALL API routes go to server (backend) - no exceptions
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: starships-app-internal
                port:
                  name: backend
          # Everything else (static files, pages, etc.) goes to client (frontend)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: starships-app-internal
                port:
                  name: frontend
    - host: www.starships.ai
      http:
        paths:
          # ALL API routes go to server (backend) - no exceptions
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: starships-app-internal
                port:
                  name: backend
          # Everything else (static files, pages, etc.) goes to client (frontend)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: starships-app-internal
                port:
                  name: frontend
