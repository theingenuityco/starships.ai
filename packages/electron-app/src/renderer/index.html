<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starships Electron App</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji',
          'Segoe UI Emoji';
      }
      .wrap {
        display: grid;
        place-items: center;
        height: 100vh;
      }
      .card {
        padding: 24px;
        border: 1px solid rgba(127, 127, 127, 0.35);
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 6px 0;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0;
        opacity: 0.75;
        font-size: 13px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Blank Electron app</h1>
        <p>Package: <code>@starships/electron-app</code></p>
      </div>
    </div>
  </body>
</html>
