apiVersion: v1
kind: Service
metadata:
  name: starships-app-headless
  namespace: starships-dev
  labels:
    app: starships-ai
    environment: dev
spec:
  clusterIP: None
  selector:
    app: starships-ai
    environment: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-app
  namespace: starships-dev
  labels:
    app: starships-ai
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: starships-ai
      environment: dev
  template:
    metadata:
      labels:
        app: starships-ai
        environment: dev
    spec:
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: starships
          image: ghcr.io/theingenuityco/starships.ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: frontend
            - containerPort: 3001
              name: docs
            - containerPort: 4000
              name: backend

          env:
            - name: NODE_ENV
              value: 'development'
            - name: RUNNER_URL
              value: 'http://autopilot-runner.starships-dev.svc.cluster.local:50051'
            - name: RUNNER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: RUNNER_AUTH_TOKEN
            - name: SKIP_BUILD
              value: 'true'
            - name: SKIP_INSTALL
              value: 'true'
            - name: PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: PUBLIC_URL
            - name: CLIENT_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: CLIENT_URL
            - name: SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SERVER_URL
            - name: DOCS_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DOCS_URL
            # SEO / indexing (default should be false for dev/staging instances)
            - name: ENABLE_INDEXING
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: ENABLE_INDEXING
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: JWT_SECRET
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_DATABASE
            - name: POSTGRES_SSL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_SSL
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENROUTER_API_KEY

            # Redis (required for conversation streaming via Redis Streams)
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: REDIS_PORT
            - name: REDIS_DB
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: REDIS_DB
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: REDIS_PASSWORD
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_PUBLISHABLE_KEY
            - name: GA_MEASUREMENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GA_MEASUREMENT_ID
            - name: USERBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: USERBACK_TOKEN
            - name: SENTRY_DSN_CLIENT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SENTRY_DSN_CLIENT
            - name: SENTRY_DSN_SERVER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SENTRY_DSN_SERVER
            # OAuth (GitHub OAuth App for login)
            - name: GH_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GH_OAUTH_CLIENT_ID
            - name: GH_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GH_OAUTH_CLIENT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: EMAIL_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: EMAIL_FROM_ADDRESS
            - name: EMAIL_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: EMAIL_FROM_NAME
            - name: AWS_SES_REGION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_SES_REGION
            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_S3_BUCKET
            - name: AWS_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_S3_REGION
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: ENCRYPTION_KEY

          readinessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5

          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '2Gi'
