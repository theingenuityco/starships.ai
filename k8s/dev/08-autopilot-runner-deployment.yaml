apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot-runner
  namespace: starships-dev
  labels:
    app: autopilot-runner
    environment: dev
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: autopilot-runner
      environment: dev
  template:
    metadata:
      labels:
        app: autopilot-runner
        environment: dev
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: autopilot-runner
          image: ghcr.io/theingenuityco/autopilot-runner:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: RUNNER_PORT
              value: '50051'
            - name: RUNNER_CONCURRENCY
              value: '4'
            - name: RUNNER_FASTPATH_ENABLED
              value: 'true'
            - name: RUNNER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: RUNNER_AUTH_TOKEN
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENROUTER_API_KEY
            # Azure AI Foundry (optional LLM provider)
            - name: AZURE_AI_FOUNDRY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AZURE_AI_FOUNDRY_API_KEY
            - name: AZURE_AI_FOUNDRY_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AZURE_AI_FOUNDRY_ENDPOINT
            - name: AZURE_AI_FOUNDRY_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AZURE_AI_FOUNDRY_API_VERSION
            # AWS Bedrock (optional LLM provider)
            - name: AWS_BEDROCK_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_BEDROCK_ACCESS_KEY_ID
            - name: AWS_BEDROCK_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_BEDROCK_SECRET_ACCESS_KEY
            - name: AWS_BEDROCK_REGION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_BEDROCK_REGION
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
