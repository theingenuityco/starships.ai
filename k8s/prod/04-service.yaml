apiVersion: v1
kind: Service
metadata:
  name: starships-service
  namespace: starships-prod
  labels:
    app: starships-ai
    environment: production
spec:
  type: ClusterIP
  selector:
    app: starships-ai
    environment: production
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: api
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800