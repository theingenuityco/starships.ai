name: Deploy to Production (AWS EKS)

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: theingenuityco/starships.ai
  AWS_REGION: ap-south-1
  EKS_CLUSTER: starships-prod
  NAMESPACE: starships-prod

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    name: Deploy Image to EKS (Prod)
    runs-on: ubuntu-latest
    environment: prod

    # Run when build workflow succeeded, or when dispatched manually
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tag
        id: get-image
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$SHA" ]; then
            IMAGE_TAG="latest"
          else
            SHORT_SHA=$(echo "$SHA" | cut -c1-7)
            IMAGE_TAG="sha-${SHORT_SHA}"
          fi
          echo "Using image tag: ${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Validate manifests
        run: |
          kubectl apply --dry-run=client -f k8s/prod/00-namespace.yaml
          kubectl apply --dry-run=client -f k8s/prod/01-storage-class.yaml
          kubectl apply --dry-run=client -f k8s/prod/03-deployment.yaml
          kubectl apply --dry-run=client -f k8s/prod/04-service.yaml
          kubectl apply --dry-run=client -f k8s/prod/05-ingress.yaml
          # RBAC for k8s job runner was removed
          kubectl apply --dry-run=client -f k8s/prod/07-autopilot-runner-networkpolicy.yaml
          kubectl apply --dry-run=client -f k8s/prod/08-autopilot-runner-deployment.yaml
          kubectl apply --dry-run=client -f k8s/prod/09-autopilot-runner-service.yaml
          # Ensure Postgres and Redis are defined before scheduler/worker Deployments
          kubectl apply --dry-run=client -f k8s/prod/13-postgres-statefulset.yaml
          kubectl apply --dry-run=client -f k8s/prod/12-redis-statefulset.yaml
          kubectl apply --dry-run=client -f k8s/prod/10-schedule-scheduler-deployment.yaml
          kubectl apply --dry-run=client -f k8s/prod/11-schedule-worker-deployment.yaml
          echo "✅ Kubernetes manifests validated successfully."

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/prod/00-namespace.yaml
          kubectl apply -f k8s/prod/01-storage-class.yaml
          kubectl apply -f k8s/prod/03-deployment.yaml
          kubectl apply -f k8s/prod/04-service.yaml
          kubectl apply -f k8s/prod/05-ingress.yaml
          # RBAC for k8s job runner was removed
          kubectl apply -f k8s/prod/07-autopilot-runner-networkpolicy.yaml
          kubectl apply -f k8s/prod/08-autopilot-runner-deployment.yaml
          kubectl apply -f k8s/prod/09-autopilot-runner-service.yaml
          # Ensure Postgres and Redis are created before scheduling components
          kubectl apply -f k8s/prod/13-postgres-statefulset.yaml
          kubectl apply -f k8s/prod/12-redis-statefulset.yaml
          kubectl apply -f k8s/prod/10-schedule-scheduler-deployment.yaml
          kubectl apply -f k8s/prod/11-schedule-worker-deployment.yaml
          echo "✅ Applied manifests to prod cluster."

      - name: Update secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
          POSTGRES_SSL: ${{ secrets.POSTGRES_SSL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SERVER_URL: ${{ vars.SERVER_URL }}
          CLIENT_URL: ${{ vars.CLIENT_URL }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          DOCS_URL: ${{ vars.DOCS_URL }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          USERBACK_TOKEN: ${{ secrets.USERBACK_TOKEN }}
          SENTRY_DSN_CLIENT: ${{ secrets.SENTRY_DSN_CLIENT }}
          SENTRY_DSN_SERVER: ${{ secrets.SENTRY_DSN_SERVER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.GITHUB_APP_PRIVATE_KEY_BASE64 }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          RUNNER_AUTH_TOKEN: ${{ secrets.RUNNER_AUTH_TOKEN }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          AWS_SES_REGION: ${{ vars.AWS_SES_REGION }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ vars.AWS_S3_REGION }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_DB: ${{ secrets.REDIS_DB }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          # Provide sane defaults for internal Redis if overrides are not set
          REDIS_HOST="${REDIS_HOST:-redis}"
          REDIS_PORT="${REDIS_PORT:-6379}"

          # Provide sane defaults for PostgreSQL so only password (and optionally host)
          # need to be explicitly configured for most environments.
          POSTGRES_HOST="${POSTGRES_HOST:-postgres}"
          POSTGRES_PORT="${POSTGRES_PORT:-5432}"
          POSTGRES_USER="${POSTGRES_USER:-postgres}"
          POSTGRES_DATABASE="${POSTGRES_DATABASE:-starships}"
          POSTGRES_SSL="${POSTGRES_SSL:-false}"

          kubectl delete secret starships-secrets -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl create secret generic starships-secrets \
            --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            --from-literal=STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            --from-literal=STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
            --from-literal=GITHUB_APP_ID="$GITHUB_APP_ID" \
            --from-literal=GITHUB_APP_PRIVATE_KEY_BASE64="$GITHUB_APP_PRIVATE_KEY_BASE64" \
            --from-literal=GH_OAUTH_CLIENT_ID="${GH_OAUTH_CLIENT_ID}" \
            --from-literal=GH_OAUTH_CLIENT_SECRET="${GH_OAUTH_CLIENT_SECRET}" \
            --from-literal=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --from-literal=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            --from-literal=LINKEDIN_CLIENT_ID="$LINKEDIN_CLIENT_ID" \
            --from-literal=LINKEDIN_CLIENT_SECRET="$LINKEDIN_CLIENT_SECRET" \
            --from-literal=GOOGLE_DRIVE_CLIENT_ID="$GOOGLE_DRIVE_CLIENT_ID" \
            --from-literal=GOOGLE_DRIVE_CLIENT_SECRET="$GOOGLE_DRIVE_CLIENT_SECRET" \
            --from-literal=DISCORD_CLIENT_ID="$DISCORD_CLIENT_ID" \
            --from-literal=DISCORD_CLIENT_SECRET="$DISCORD_CLIENT_SECRET" \
            --from-literal=DISCORD_BOT_TOKEN="$DISCORD_BOT_TOKEN" \
            --from-literal=STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            --from-literal=POSTGRES_HOST="$POSTGRES_HOST" \
            --from-literal=POSTGRES_PORT="$POSTGRES_PORT" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DATABASE="$POSTGRES_DATABASE" \
            --from-literal=POSTGRES_SSL="$POSTGRES_SSL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=ENCRYPTION_KEY="$ENCRYPTION_KEY" \
            --from-literal=SERVER_URL="$SERVER_URL" \
            --from-literal=CLIENT_URL="$CLIENT_URL" \
            --from-literal=PUBLIC_URL="$PUBLIC_URL" \
            --from-literal=DOCS_URL="$DOCS_URL" \
            --from-literal=GA_MEASUREMENT_ID="$GA_MEASUREMENT_ID" \
            --from-literal=USERBACK_TOKEN="$USERBACK_TOKEN" \
            --from-literal=SENTRY_DSN_CLIENT="$SENTRY_DSN_CLIENT" \
            --from-literal=SENTRY_DSN_SERVER="$SENTRY_DSN_SERVER" \
            --from-literal=RUNNER_AUTH_TOKEN="$RUNNER_AUTH_TOKEN" \
            --from-literal=EMAIL_FROM_ADDRESS="$EMAIL_FROM_ADDRESS" \
            --from-literal=EMAIL_FROM_NAME="$EMAIL_FROM_NAME" \
            --from-literal=AWS_SES_REGION="$AWS_SES_REGION" \
            --from-literal=AWS_S3_BUCKET="$AWS_S3_BUCKET" \
            --from-literal=AWS_S3_REGION="$AWS_S3_REGION" \
            --from-literal=REDIS_HOST="$REDIS_HOST" \
            --from-literal=REDIS_PORT="$REDIS_PORT" \
            --from-literal=REDIS_DB="$REDIS_DB" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            -n ${{ env.NAMESPACE }}

          # Redis auth secret
          kubectl delete secret redis-auth -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl create secret generic redis-auth \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            -n ${{ env.NAMESPACE }}

          kubectl delete secret ghcr-pull-secret -n ${{ env.NAMESPACE }} --ignore-not-found=true
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.repository_owner }} \
            --docker-password="$GHCR_PULL_TOKEN" \
            -n ${{ env.NAMESPACE }}
          echo "✅ Secrets updated successfully."

      - name: Deploy new image
        run: |
          echo "Deploying image tag: ${{ steps.get-image.outputs.image_tag }}"
          kubectl set image deployment/starships-app \
            starships=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get-image.outputs.image_tag }} \
            -n ${{ env.NAMESPACE }}
          # Force rollout restart to pull latest image (needed when using 'latest' tag)
          kubectl rollout restart deployment/starships-app -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/starships-app -n ${{ env.NAMESPACE }} --timeout=600s
          echo "✅ Deployment rolled out successfully."

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get pv,pvc -n ${{ env.NAMESPACE }} || true
          kubectl logs -n ${{ env.NAMESPACE }} deployment/starships-app --tail=30 || true
          echo "✅ Verification complete."
