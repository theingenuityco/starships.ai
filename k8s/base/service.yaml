apiVersion: v1
kind: Service
metadata:
  name: starships-service
  namespace: starships-ai
  labels:
    app: starships-ai
    component: application
spec:
  type: ClusterIP
  selector:
    app: starships-ai
    component: application
  ports:
  - name: frontend
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: backend
    port: 4000
    targetPort: 4000
    protocol: TCP
  - name: neo4j-http
    port: 7474
    targetPort: 7474
    protocol: TCP
  - name: neo4j-bolt
    port: 7687
    targetPort: 7687
    protocol: TCP

---
# NodePort service for development/testing
apiVersion: v1
kind: Service
metadata:
  name: starships-nodeport
  namespace: starships-ai
  labels:
    app: starships-ai
    component: application
spec:
  type: NodePort
  selector:
    app: starships-ai
    component: application
  ports:
  - name: frontend
    port: 3000
    targetPort: 3000
    nodePort: 30000
    protocol: TCP
  - name: backend
    port: 4000
    targetPort: 4000
    nodePort: 30001
    protocol: TCP