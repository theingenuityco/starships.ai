syntax = "proto3";

package runner;

service Runner {
  rpc Execute (ExecuteRequest) returns (ExecuteResponse);
  rpc ExecuteStream (ExecuteRequest) returns (stream ExecuteChunk);
}

message ExecuteRequest {
  string blueprint_json = 1;
  string execution_json = 2;
  string config_json = 3;
  string request_id = 4;
  int32 priority = 5;
  int64 timeout_ms = 6;
}

message ExecuteResponse {
  string result_json = 1;
  string request_id = 2;
  int64 duration_ms = 3;
}

message ExecuteChunk {
  string type = 1;      // event, delta, log, completed
  string data_json = 2; // payload
  string request_id = 3;
}
