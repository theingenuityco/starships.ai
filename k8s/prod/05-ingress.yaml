apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starships-app-ingress
  namespace: starships-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - starships.ai
    - www.starships.ai
    secretName: starships-tls-cert
  rules:
  - host: starships.ai
    http:
      paths:
      # Auth routes must go to frontend (Next.js/Kinde handles these)
      # This must come BEFORE the general /api rule
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Other API routes go to backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3001
      # Everything else goes to frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
  - host: www.starships.ai
    http:
      paths:
      # Auth routes must go to frontend (Next.js/Kinde handles these)
      # This must come BEFORE the general /api rule
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Other API routes go to backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3001
      # Everything else goes to frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000