apiVersion: v1
kind: Service
metadata:
  name: starships-app-internal
  namespace: starships-prod
spec:
  type: ClusterIP
  selector:
    app: starships-ai
  ports:
    - name: frontend
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: backend
      port: 4000
      targetPort: 3001
      protocol: TCP