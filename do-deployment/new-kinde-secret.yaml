apiVersion: v1
kind: Secret
metadata:
  name: kinde-auth-secret
  namespace: starships-prod
type: Opaque
stringData:
  KINDE_CLIENT_ID: "[KINDE-CLIENT-ID]"
  KINDE_CLIENT_SECRET: "[API-KEY]"
  KINDE_ISSUER_URL: "[KINDE-ISSUER-URL]"
  KINDE_SITE_URL: "[INSECURE-PROD-URL]"
  KINDE_POST_LOGIN_REDIRECT_URL: "[INSECURE-PROD-URL]/fleet"
  KINDE_POST_LOGOUT_REDIRECT_URL: "[INSECURE-PROD-URL]"