apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: starships-prod
  labels:
    app: postgres
    environment: production
spec:
  type: ClusterIP
  selector:
    app: postgres
    environment: production
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: starships-prod
  labels:
    app: postgres
    environment: production
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      environment: production
  template:
    metadata:
      labels:
        app: postgres
        environment: production
    spec:
      initContainers:
        - name: migrate-postgres-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              if [ -f /new/data/pgdata/postgresql.conf ] && [ -f /new/data/pgdata/PG_VERSION ]; then
                echo "New Postgres data already initialized; skipping migration."
                exit 0
              fi

              if [ ! -d /old ] || [ -z "$(ls -A /old 2>/dev/null)" ]; then
                echo "No existing Postgres data found on old volume; skipping migration."
                exit 0
              fi

              echo "Copying existing Postgres data from old volume to new volume..."
              mkdir -p /new/data
              cp -a /old/. /new/data/.
              echo "Postgres data copy complete."
          volumeMounts:
            - name: old-postgres-data
              mountPath: /old
            - name: postgres-data
              mountPath: /new/data
              subPath: postgres
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            # Use the same credentials and database name as the application
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PASSWORD
            # Ensure PGDATA matches the in-container path used by the fat container
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            requests:
              cpu: '500m'
              memory: '1Gi'
            limits:
              cpu: '2000m'
              memory: '4Gi'
      volumes:
        # Old PVC from starships-app; used only for one-time data migration
        - name: old-postgres-data
          persistentVolumeClaim:
            claimName: starships-data-starships-app-0
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 30Gi
