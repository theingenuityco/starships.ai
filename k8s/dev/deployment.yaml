apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-app
  namespace: starships-dev
  labels:
    app: starships-ai
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starships-ai
      environment: dev
  template:
    metadata:
      labels:
        app: starships-ai
        environment: dev
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: starships
        image: [DOCKER-REGISTRY-URL]:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: frontend
        - containerPort: 4000
          name: backend
        - containerPort: 7474
          name: neo4j-http
        - containerPort: 7687
          name: neo4j-bolt
        env:
        - name: NODE_ENV
          value: "production"
        - name: SKIP_BUILD
          value: "true"
        - name: NEO4J_URI
          value: "[NEO4J-LOCAL-URL]"
        - name: NEO4J_USERNAME
          value: "neo4j"
        - name: NEO4J_PASSWORD
          value: "[DEFAULT-PASSWORD]"
        - name: SKIP_INSTALL
          value: "true"
        - name: CLIENT_URL
          value: "[DEV-DOMAIN-URL]"
        - name: NEXT_PUBLIC_API_URL
          value: "[DEV-DOMAIN-URL]/api"
        - name: SERVER_URL
          value: "http://localhost:4000"
        - name: KINDE_SITE_URL
          value: "[DEV-DOMAIN-URL]"
        - name: KINDE_POST_LOGIN_REDIRECT_URL
          value: "[DEV-DOMAIN-URL]/fleet"
        - name: KINDE_POST_LOGOUT_REDIRECT_URL
          value: "[DEV-DOMAIN-URL]"
        - name: KINDE_COOKIE_DOMAIN
          value: "dev.starships.ai"
        - name: NEXT_PUBLIC_ENABLE_AUTH_TESTING_BACKDOOR
          value: "true"
        - name: KINDE_DEBUG_MODE
          value: "true"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: OPENAI_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: ANTHROPIC_API_KEY
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_WEBHOOK_SECRET
        - name: STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_PUBLISHABLE_KEY
        envFrom:
        - secretRef:
            name: kinde-auth-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: neo4j-data
          mountPath: /var/lib/neo4j/data
        - name: app-sessions
          mountPath: /app/data/sessions
      volumes:
      - name: neo4j-data
        persistentVolumeClaim:
          claimName: neo4j-data-pvc
      - name: app-sessions
        persistentVolumeClaim:
          claimName: sessions-pvc