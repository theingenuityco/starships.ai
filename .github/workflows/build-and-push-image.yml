name: Build and Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip Build and Skip Push Image'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: theingenuityco/starships.ai

permissions:
  contents: write
  packages: write
  id-token: write
  issues: write
  pull-requests: read
  actions: read

jobs:
  # Calculate semantic version to determine if build should proceed
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      should_build: ${{ steps.build_decision.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm --version
          pnpm config set registry https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install

      - name: Calculate Semantic Version (Dry Run)
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Calculating next version (dry-run)..."
          npx semantic-release --dry-run > semantic-output.txt 2>&1 || true

          if grep -q "The next release version is" semantic-output.txt; then
            NEXT_VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' semantic-output.txt)
            echo "✅ Next version will be: ${NEXT_VERSION}"
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No new version needed - skipping build"
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "new_release_version=" >> $GITHUB_OUTPUT
          fi

      - name: Determine build decision
        id: build_decision
        run: |
          if [[ "${{ steps.semantic.outputs.new_release_published }}" == "true" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Build will proceed"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏭️ Build skipped - no new version needed"
          fi

  # Build and Push to GHCR
  build-dev-amd64:
    name: Build Dev Image (amd64)
    runs-on: [self-hosted, linux, x64, t3.xlarge, docker]
    needs: [calculate-version]
    if: |
      needs.calculate-version.outputs.should_build == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build != 'true')
      )
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.calculate-version.outputs.new_release_version }},enable=${{ needs.calculate-version.outputs.new_release_published == 'true' }}
            type=sha,format=short
            type=raw,value=latest

      - name: Derive arch-specific tags (amd64)
        id: arch_tags
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "${tag}-amd64" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Dev Docker image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.arch_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ''
          cache-to: ''
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=dev-${{ github.sha }}
            ENVIRONMENT=development
            CACHE_BUST=${{ github.run_number }}
          secrets: |
            stripe_secret_key=${{ secrets.STRIPE_SECRET_KEY }}
            stripe_publishable_key=${{ secrets.STRIPE_PUBLISHABLE_KEY }}

  build-dev-arm64:
    name: Build Dev Image (arm64)
    runs-on: [self-hosted, linux, arm64, t4g.xlarge, docker]
    needs: [calculate-version]
    if: |
      needs.calculate-version.outputs.should_build == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build != 'true')
      )
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.calculate-version.outputs.new_release_version }},enable=${{ needs.calculate-version.outputs.new_release_published == 'true' }}
            type=sha,format=short
            type=raw,value=latest

      - name: Derive arch-specific tags (arm64)
        id: arch_tags
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "${tag}-arm64" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Dev Docker image (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.arch_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ''
          cache-to: ''
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=dev-${{ github.sha }}
            ENVIRONMENT=development
            CACHE_BUST=${{ github.run_number }}
          secrets: |
            stripe_secret_key=${{ secrets.STRIPE_SECRET_KEY }}
            stripe_publishable_key=${{ secrets.STRIPE_PUBLISHABLE_KEY }}

  build-dev-manifest:
    name: Build Dev Image (multi-arch manifest)
    runs-on: [self-hosted, linux, x64, t3.small, docker]
    needs: [calculate-version, build-dev-amd64, build-dev-arm64]
    if: |
      needs.calculate-version.outputs.should_build == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build != 'true')
      )
    environment: dev
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.calculate-version.outputs.new_release_version }},enable=${{ needs.calculate-version.outputs.new_release_published == 'true' }}
            type=sha,format=short
            type=raw,value=latest

      - name: Create and push multi-arch manifests
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi

            # Use buildx imagetools to create multi-arch manifest
            # This handles cases where source images might be manifest lists
            docker buildx imagetools create --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

  build-autopilot-runner-amd64:
    name: Build Autopilot Runner Image (amd64)
    runs-on: [self-hosted, linux, x64, t3.large, docker]
    needs: [calculate-version]
    if: |
      needs.calculate-version.outputs.should_build == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build != 'true')
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (runner)
        id: meta_runner
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/theingenuityco/autopilot-runner
          tags: |
            type=raw,value=${{ needs.calculate-version.outputs.new_release_version }},enable=${{ needs.calculate-version.outputs.new_release_published == 'true' }}
            type=sha,format=short
            type=raw,value=latest

      - name: Derive arch-specific tags (runner amd64)
        id: arch_tags
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${{ steps.meta_runner.outputs.tags }}" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "${tag}-amd64" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push runner image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/autopilot-runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.arch_tags.outputs.tags }}
          labels: ${{ steps.meta_runner.outputs.labels }}
          cache-from: ''
          cache-to: ''

  build-autopilot-runner-arm64:
    name: Build Autopilot Runner Image (arm64)
    runs-on: [self-hosted, linux, arm64, t4g.large, docker]
    needs: [calculate-version]
    if: |
      needs.calculate-version.outputs.should_build == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build != 'true')
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (runner)
        id: meta_runner
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/theingenuityco/autopilot-runner
          tags: |
            type=raw,value=${{ needs.calculate-version.outputs.new_release_version }},enable=${{ needs.calculate-version.outputs.new_release_published == 'true' }}
            type=sha,format=short
            type=raw,value=latest

      - name: Derive arch-specific tags (runner arm64)
        id: arch_tags
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${{ steps.meta_runner.outputs.tags }}" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "${tag}-arm64" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push runner image (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/autopilot-runner/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.arch_tags.outputs.tags }}
          labels: ${{ steps.meta_runner.outputs.labels }}
          cache-from: ''
          cache-to: ''

  build-autopilot-runner-manifest:
    name: Build Autopilot Runner Image (multi-arch manifest)
    runs-on: [self-hosted, linux, x64, t3.small, docker]
    needs: [calculate-version, build-autopilot-runner-amd64, build-autopilot-runner-arm64]
    if: |
      needs.calculate-version.outputs.should_build == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_build != 'true')
      )
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (runner)
        id: meta_runner
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/theingenuityco/autopilot-runner
          tags: |
            type=raw,value=${{ needs.calculate-version.outputs.new_release_version }},enable=${{ needs.calculate-version.outputs.new_release_published == 'true' }}
            type=sha,format=short
            type=raw,value=latest

      - name: Create and push multi-arch manifests (runner)
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.meta_runner.outputs.tags }}" | while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi

            # Use buildx imagetools to create multi-arch manifest
            # This handles cases where source images might be manifest lists
            docker buildx imagetools create --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

  # Create Release and Tag (AFTER successful build)
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [calculate-version, build-dev-manifest, build-autopilot-runner-manifest]
    if: |
      needs.calculate-version.outputs.new_release_published == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm config set registry https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install

      - name: Create Release and Tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating release for version ${{ needs.calculate-version.outputs.new_release_version }}..."
          npx semantic-release
          echo "✅ Release created successfully"

  # Workflow Summary (build + release report)
  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [calculate-version, build-dev-manifest, build-autopilot-runner-manifest, create-release]
    if: always() && needs.calculate-version.result != 'skipped'
    steps:
      - name: Create workflow summary
        run: |
          echo "## 🔄 Build Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.calculate-version.outputs.new_release_published }}" == "true" ]]; then
            echo "✅ **Version Calculation:** New version detected (\`${{ needs.calculate-version.outputs.new_release_version }}\`)" >> $GITHUB_STEP_SUMMARY

            if [[ "${{ needs.build-dev-manifest.result }}" == "success" ]]; then
              echo "✅ **Build Status:** Docker images built and pushed successfully" >> $GITHUB_STEP_SUMMARY
              echo "   - Main app: \`ghcr.io/theingenuityco/starships.ai:${{ needs.calculate-version.outputs.new_release_version }}\`" >> $GITHUB_STEP_SUMMARY
              echo "   - Autopilot runner: \`ghcr.io/theingenuityco/autopilot-runner:${{ needs.calculate-version.outputs.new_release_version }}\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Build Status:** Docker image build failed" >> $GITHUB_STEP_SUMMARY
            fi

            if [[ "${{ needs.create-release.result }}" == "success" ]]; then
              echo "✅ **Release Status:** GitHub release created" >> $GITHUB_STEP_SUMMARY
            elif [[ "${{ needs.create-release.result }}" == "skipped" ]]; then
              echo "⏭️ **Release Status:** Skipped (manual dispatch)" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Release Status:** Failed to create release" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ **Semantic Version Check:** No new version detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** Commits since last release contain only:" >> $GITHUB_STEP_SUMMARY
            echo "- \`docs:\` (documentation changes)" >> $GITHUB_STEP_SUMMARY
            echo "- \`chore:\` (maintenance tasks)" >> $GITHUB_STEP_SUMMARY
            echo "- \`style:\`, \`refactor:\`, \`test:\`, \`perf:\` (non-feature changes)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "🔧 **Build Status:** Manual override triggered" >> $GITHUB_STEP_SUMMARY
            else
              echo "⏭️ **Build Status:** Build skipped - no images were pushed" >> $GITHUB_STEP_SUMMARY
              echo "⏭️ **Deploy Status:** Deployment will be skipped (no new image available)" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To trigger a release, use one of these commit prefixes:" >> $GITHUB_STEP_SUMMARY
            echo "- \`feat:\` for new features (minor version bump)" >> $GITHUB_STEP_SUMMARY
            echo "- \`fix:\` for bug fixes (patch version bump)" >> $GITHUB_STEP_SUMMARY
            echo "- \`BREAKING CHANGE:\` for breaking changes (major version bump)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
