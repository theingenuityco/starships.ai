apiVersion: v1
kind: ServiceAccount
metadata:
  name: autopilot-runner
  namespace: starships-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autopilot-runner
  namespace: starships-dev
rules:
  - apiGroups: ['batch']
    resources: ['jobs']
    verbs: ['create', 'get', 'list', 'watch', 'delete']
  - apiGroups: ['']
    resources: ['pods', 'pods/log']
    verbs: ['get', 'list', 'watch', 'delete']
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['create', 'get', 'delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autopilot-runner
  namespace: starships-dev
subjects:
  - kind: ServiceAccount
    name: autopilot-runner
roleRef:
  kind: Role
  name: autopilot-runner
  apiGroup: rbac.authorization.k8s.io
