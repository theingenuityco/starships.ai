apiVersion: v1
kind: Service
metadata:
  name: starships-service
  namespace: starships-prod
  labels:
    app: starships-ai
    environment: production
spec:
  type: ClusterIP
  selector:
    app: starships-ai
    environment: production
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: frontend
  - port: 4000
    targetPort: 3001
    protocol: TCP
    name: backend
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800