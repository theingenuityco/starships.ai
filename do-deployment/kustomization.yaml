# Kustomization for production deployment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: starships-prod

resources:
  - all-in-one-optimized.yaml
  - kinde-secret.yaml

images:
  - name: [DOCKER-REGISTRY-URL]
    newTag: latest

configMapGenerator:
  - name: app-config
    literals:
      - NODE_ENV=production
      - CLIENT_URL=http://[HARDCODED-IP]
      - NEXT_PUBLIC_API_URL=http://[HARDCODED-IP]:4000