apiVersion: v1
kind: Service
metadata:
  name: starships-lb
  namespace: starships-prod
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
spec:
  type: LoadBalancer
  selector:
    app: starships-ai  # Updated to match our deployment
  ports:
  - name: frontend
    port: 80
    targetPort: 3000
  - name: backend
    port: 4000
    targetPort: 4000