apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starships-app
  namespace: starships-prod
  labels:
    app: starships-ai
  annotations:
    # AWS Load Balancer Controller
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'

    # SSL Certificate - REPLACE WITH YOUR CERT ARN
    # Get from: aws acm list-certificates --region ap-south-1
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:577012215849:certificate/ea27c874-dbb4-4c0c-8cf6-113a8de7a40d
    alb.ingress.kubernetes.io/ssl-redirect: '443'

    # Health checks
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: '4000'
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/success-codes: '200'

    # Timeouts (important for SSE streaming)
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600

    # Target group settings
    alb.ingress.kubernetes.io/target-group-attributes: |
      deregistration_delay.timeout_seconds=30,
      stickiness.enabled=false

    # Tags
    alb.ingress.kubernetes.io/tags: Environment=production,Project=starships

spec:
  ingressClassName: alb
  rules:
    # starships.ai
    - host: starships.ai
      http:
        paths:
          # Docs (must be first)
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: starships-app
                port:
                  number: 3001

          # API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: starships-app
                port:
                  number: 4000

          # Frontend (catch-all, last)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: starships-app
                port:
                  number: 3000

    # www.starships.ai
    - host: www.starships.ai
      http:
        paths:
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: starships-app
                port:
                  number: 3001

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: starships-app
                port:
                  number: 4000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: starships-app
                port:
                  number: 3000
