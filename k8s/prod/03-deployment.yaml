apiVersion: v1
kind: Service
metadata:
  name: starships-app-headless
  namespace: starships-prod
  labels:
    app: starships-ai
    environment: production
spec:
  clusterIP: None # Headless service for StatefulSet
  selector:
    app: starships-ai
    environment: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-app
  namespace: starships-prod
  labels:
    app: starships-ai
    environment: production
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: starships-ai
      environment: production
  template:
    metadata:
      labels:
        app: starships-ai
        environment: production
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '4000'
    spec:
      terminationGracePeriodSeconds: 30 # Graceful shutdown

      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: starships
          image: 'ghcr.io/theingenuityco/starships.ai:latest' # Update via CI/CD
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
              name: frontend
            - containerPort: 3001
              name: docs
            - containerPort: 4000
              name: backend

          env:
            # Core Settings
            - name: NODE_ENV
              value: 'production' # Changed from 'development'
            - name: RUNNER_URL
              value: 'http://autopilot-runner.starships-prod.svc.cluster.local:50051'
            - name: RUNNER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: RUNNER_AUTH_TOKEN
            - name: SKIP_BUILD
              value: 'true'
            - name: SKIP_INSTALL
              value: 'true'

            # URLs
            - name: PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: PUBLIC_URL
            - name: CLIENT_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: CLIENT_URL
            - name: SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SERVER_URL
            - name: DOCS_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DOCS_URL

            # SEO / indexing (set true ONLY on canonical prod)
            - name: ENABLE_INDEXING
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: ENABLE_INDEXING

            # Email sending gate (set true in prod unless explicitly disabled)
            - name: ENABLE_EMAILS
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: ENABLE_EMAILS

            # Auth
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: JWT_SECRET
            - name: REVALIDATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: REVALIDATE_TOKEN

            # PostgreSQL
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_DATABASE
            - name: POSTGRES_SSL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_SSL

            # LLM Providers
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENROUTER_API_KEY
            # Azure AI Foundry (optional LLM provider)
            - name: AZURE_AI_FOUNDRY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AZURE_AI_FOUNDRY_API_KEY
            - name: AZURE_AI_FOUNDRY_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AZURE_AI_FOUNDRY_ENDPOINT
            - name: AZURE_AI_FOUNDRY_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AZURE_AI_FOUNDRY_API_VERSION
            # AWS Bedrock (optional LLM provider)
            - name: AWS_BEDROCK_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_BEDROCK_ACCESS_KEY_ID
            - name: AWS_BEDROCK_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_BEDROCK_SECRET_ACCESS_KEY
            - name: AWS_BEDROCK_REGION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_BEDROCK_REGION

            # Redis (required for conversation streaming via Redis Streams)
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: REDIS_PORT
            - name: REDIS_DB
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: REDIS_DB
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: REDIS_PASSWORD

            # Stripe
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_PUBLISHABLE_KEY

            # Analytics
            - name: GA_MEASUREMENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GA_MEASUREMENT_ID
            - name: META_PIXEL_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: META_PIXEL_ID
            - name: POSTHOG_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTHOG_KEY
            - name: POSTHOG_HOST
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTHOG_HOST
            - name: SENTRY_DSN_CLIENT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SENTRY_DSN_CLIENT
            - name: SENTRY_DSN_SERVER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SENTRY_DSN_SERVER

            - name: VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: VAPID_SUBJECT
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: VAPID_PUBLIC_KEY
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: VAPID_PRIVATE_KEY

            # OAuth (GitHub OAuth App for login)
            - name: GH_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GH_OAUTH_CLIENT_ID
            - name: GH_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GH_OAUTH_CLIENT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_CLIENT_SECRET

            # Email
            - name: EMAIL_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: EMAIL_FROM_ADDRESS
            - name: EMAIL_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: EMAIL_FROM_NAME
            - name: AWS_SES_REGION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_SES_REGION
            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_S3_BUCKET
            - name: AWS_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_S3_REGION
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: ENCRYPTION_KEY

          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '2Gi'
          # Production health checks (updated to use /api/health)
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5

          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30 # 5 minutes max

