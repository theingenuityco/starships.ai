apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  namespace: starships-prod
  labels:
    app: starships-ai
    purpose: metabase-access
spec:
  type: NodePort
  selector:
    app: starships-ai
    environment: production
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      nodePort: 30432
      protocol: TCP
