apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-app
  namespace: starships-prod
  labels:
    app: starships-ai
    environment: production
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: starships-ai
      environment: production
  template:
    metadata:
      labels:
        app: starships-ai
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      # Security Context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Anti-affinity for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - starships-ai
              topologyKey: kubernetes.io/hostname
      
      imagePullSecrets:
      - name: ghcr-pull-secret
      
      containers:
      - name: starships
        image: ghcr.io/theingenuityco/starships.ai:latest
        imagePullPolicy: Always
        
        ports:
        - containerPort: 3000
          name: frontend
          protocol: TCP
        - containerPort: 4000
          name: backend
          protocol: TCP
        - containerPort: 7474
          name: neo4j-http
          protocol: TCP
        - containerPort: 7687
          name: neo4j-bolt
          protocol: TCP
        
        # Production Environment Variables
        env:
        # Core Settings
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: SKIP_BUILD
          value: "true"
        - name: SKIP_INSTALL
          value: "true"
        
        # URLs
        - name: CLIENT_URL
          value: "https://starships.ai"
        - name: NEXT_PUBLIC_API_URL
          value: "https://starships.ai/api"
        - name: SERVER_URL
          value: "http://localhost:4000"
        
        # Neo4j Configuration (with auth enabled)
        - name: NEO4J_URI
          value: "bolt://localhost:7687"
        - name: NEO4J_USERNAME
          value: "neo4j"
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: NEO4J_PASSWORD
        - name: NEO4J_AUTH
          value: "neo4j/$(NEO4J_PASSWORD)"
        
        # Kinde OAuth
        - name: KINDE_SITE_URL
          value: "https://starships.ai"
        - name: KINDE_POST_LOGIN_REDIRECT_URL
          value: "https://starships.ai/fleet"
        - name: KINDE_POST_LOGOUT_REDIRECT_URL
          value: "https://starships.ai"
        - name: KINDE_COOKIE_DOMAIN
          value: ".starships.ai"
        - name: KINDE_REDIRECT_URL
          value: "https://starships.ai/api/auth/kinde_callback"
        
        # Security: Disable debug modes
        - name: NEXT_PUBLIC_ENABLE_AUTH_TESTING_BACKDOOR
          value: "false"
        - name: KINDE_DEBUG_MODE
          value: "false"
        
        # API Keys from Secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: OPENAI_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: ANTHROPIC_API_KEY
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_WEBHOOK_SECRET
        - name: STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_PUBLISHABLE_KEY
        
        # Pull Kinde secrets
        envFrom:
        - secretRef:
            name: kinde-auth-secret
        
        # Resource Limits
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "3Gi"
            cpu: "1500m"
        
        # Health Checks
        livenessProbe:
          httpGet:
            path: /api/health
            port: 4000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        # Startup Probe for slow starts
        startupProbe:
          httpGet:
            path: /api/health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        
        # Volume Mounts
        volumeMounts:
        - name: neo4j-data
          mountPath: /var/lib/neo4j/data
        - name: app-sessions
          mountPath: /app/data/sessions
        
      # Volumes
      volumes:
      - name: neo4j-data
        persistentVolumeClaim:
          claimName: neo4j-data-pvc
      - name: app-sessions
        persistentVolumeClaim:
          claimName: sessions-pvc