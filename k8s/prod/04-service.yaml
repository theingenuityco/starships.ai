apiVersion: v1
kind: Service
metadata:
  name: starships-app
  namespace: starships-prod
  labels:
    app: starships-ai
    environment: production
spec:
  type: ClusterIP
  selector:
    app: starships-ai
    environment: production
  ports:
    - name: frontend
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: docs
      port: 3001
      targetPort: 3001
      protocol: TCP
    - name: backend
      port: 4000
      targetPort: 4000
      protocol: TCP
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
