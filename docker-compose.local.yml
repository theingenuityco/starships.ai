version: '3.8'

services:
  neo4j:
    image: neo4j:5.9.0
    container_name: starships-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/[DEFAULT-PASSWORD]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  app:
    image: starships-local:fixed
    container_name: starships-app
    ports:
      - "3000:3000"
      - "4000:4000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=[DEFAULT-PASSWORD]
      - NEO4J_EXTERNAL_URI=bolt://neo4j:7687
      - KINDE_CLIENT_ID=[KINDE-CLIENT-ID]
      - KINDE_CLIENT_SECRET=[API-KEY]
      - KINDE_ISSUER_URL=[KINDE-ISSUER-URL]
      - KINDE_SITE_URL=http://localhost:3000
      - KINDE_POST_LOGIN_REDIRECT_URL=http://localhost:3000/fleet
      - KINDE_POST_LOGOUT_REDIRECT_URL=http://localhost:3000
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - neo4j
    command: ["/bin/sh", "-c", "sleep 10 && /app/docker-entrypoint.sh"]

volumes:
  neo4j-data:
  neo4j-logs: