name: Build and Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      skip_build:
        description: 'Skip build and only deploy'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: theingenuityco/starships.ai

permissions:
  contents: write
  packages: write
  id-token: write
  issues: write
  pull-requests: read
  actions: read

jobs:
  # Calculate semantic version to determine if dev build should proceed
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      should_build: ${{ steps.build_decision.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm --version
          # Configure pnpm to use npmmirror.com (reliable mirror in case npm is down)
          pnpm config set registry https://registry.npmmirror.com

      - name: Install semantic-release dependencies
        run: pnpm add -D semantic-release @semantic-release/git @semantic-release/github @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/npm

      - name: Calculate Semantic Version
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run semantic-release in dry-run mode to check if new version should be published
          npx semantic-release --dry-run > semantic-output.txt 2>&1 || true
          
          # Check if a new version would be published
          if grep -q "The next release version is" semantic-output.txt; then
            NEXT_VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' semantic-output.txt)
            echo "New version would be published: ${NEXT_VERSION}"
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "No new version would be published"
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "new_release_version=" >> $GITHUB_OUTPUT
          fi

      - name: Determine build decision
        id: build_decision
        run: |
          # Build should proceed if:
          # 1. New release would be published, OR
          # 2. Manual workflow dispatch (workflow_dispatch allows override)
          if [[ "${{ steps.semantic.outputs.new_release_published }}" == "true" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Build will proceed"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Build will be skipped - no meaningful changes detected"
          fi

  # Development Build and Deploy (triggered on semantic version or manual override)
  build-dev:
    name: Build Dev Image
    runs-on: ubuntu-latest
    needs: [calculate-version]
    if: |
      needs.calculate-version.outputs.should_build == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' && github.event.inputs.skip_build != 'true')
      )
    environment: dev
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Dev Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ''
          cache-to: ''
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=dev-${{ github.sha }}
            ENVIRONMENT=development
            CACHE_BUST=${{ github.run_number }}
          secrets: |
            stripe_secret_key=${{ secrets.STRIPE_SECRET_KEY }}
            stripe_publishable_key=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            kinde_client_id=${{ secrets.KINDE_CLIENT_ID }}
            kinde_client_secret=${{ secrets.KINDE_CLIENT_SECRET }}
            kinde_issuer_url=${{ vars.KINDE_ISSUER_URL }}
            kinde_site_url=${{ vars.KINDE_SITE_URL }}
            kinde_post_login_redirect_url=${{ vars.KINDE_POST_LOGIN_REDIRECT_URL }}
            kinde_post_logout_redirect_url=${{ vars.KINDE_POST_LOGOUT_REDIRECT_URL }}
            next_public_api_url=${{ vars.NEXT_PUBLIC_API_URL }}
            next_public_server_url=${{ vars.NEXT_PUBLIC_SERVER_URL }}

  # Production Build (triggered on release)
  build-prod:
    name: Build Prod Image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.skip_build != 'true')
    environment: prod
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=prod-,format=short
            type=raw,value=prod-latest
            type=raw,value=prod-${{ github.event.release.tag_name || 'manual' }}

      - name: Build and push Prod Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ''
          cache-to: ''
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ github.event.release.tag_name || github.sha }}
            ENVIRONMENT=production
            CACHE_BUST=${{ github.run_number }}
          secrets: |
            stripe_secret_key=${{ secrets.STRIPE_SECRET_KEY }}
            stripe_publishable_key=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            kinde_client_id=${{ secrets.KINDE_CLIENT_ID }}
            kinde_client_secret=${{ secrets.KINDE_CLIENT_SECRET }}
            kinde_issuer_url=${{ vars.KINDE_ISSUER_URL }}
            kinde_site_url=${{ vars.KINDE_SITE_URL }}
            kinde_post_login_redirect_url=${{ vars.KINDE_POST_LOGIN_REDIRECT_URL }}
            kinde_post_logout_redirect_url=${{ vars.KINDE_POST_LOGOUT_REDIRECT_URL }}
            next_public_api_url=${{ vars.NEXT_PUBLIC_API_URL }}
            next_public_server_url=${{ vars.NEXT_PUBLIC_SERVER_URL }}

  # Deploy to Development
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [calculate-version, build-dev]
    if: |
      needs.calculate-version.outputs.should_build == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
      )
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Setup Kubernetes
        run: |
          doctl kubernetes cluster kubeconfig save starships-dev
          kubectl config use-context do-nyc1-starships-dev

      - name: Update Kubernetes secrets
        run: |
          # Delete existing secrets if they exist
          kubectl delete secret starships-secrets -n starships-dev --ignore-not-found=true
          kubectl delete secret kinde-auth-secret -n starships-dev --ignore-not-found=true
          
          # Create new secrets from GitHub secrets
          kubectl create secret generic starships-secrets \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --from-literal=STRIPE_PUBLISHABLE_KEY="${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
            --from-literal=NEO4J_PASSWORD="${{ secrets.NEO4J_PASSWORD || 'mcppassword' }}" \
            -n starships-dev
          
          kubectl create secret generic kinde-auth-secret \
            --from-literal=KINDE_CLIENT_ID="${{ secrets.KINDE_CLIENT_ID }}" \
            --from-literal=KINDE_CLIENT_SECRET="${{ secrets.KINDE_CLIENT_SECRET }}" \
            -n starships-dev
          
          # Create GitHub registry secret
          kubectl delete secret ghcr-pull-secret -n starships-dev --ignore-not-found=true
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            -n starships-dev
          
          echo "✅ Dev secrets updated successfully"

      - name: Update image in deployment
        run: |
          # Force a new rollout by updating with timestamp annotation
          kubectl patch deployment starships-app -n starships-dev \
            -p '{"spec":{"template":{"metadata":{"annotations":{"deployment.kubernetes.io/revision":"'$(date +%s)'"}}}}}'
          
          # Also ensure we're using the latest image
          kubectl set image deployment/starships-app \
            starships=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -n starships-dev
          
          # Wait for rollout
          kubectl rollout status deployment/starships-app -n starships-dev --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n starships-dev
          kubectl logs -n starships-dev deployment/starships-app --tail=50 | grep "Server running" || true

  # Deploy to Production
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-prod]
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: 
      name: prod
      url: https://starships.ai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Setup Kubernetes
        run: |
          doctl kubernetes cluster kubeconfig save starships-prod
          kubectl config use-context do-nyc1-starships-prod

      - name: Update Kubernetes secrets
        run: |
          # Delete existing secrets if they exist
          kubectl delete secret starships-secrets -n starships-prod --ignore-not-found=true
          kubectl delete secret kinde-auth-secret -n starships-prod --ignore-not-found=true
          
          # Create new secrets from GitHub secrets
          kubectl create secret generic starships-secrets \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --from-literal=STRIPE_PUBLISHABLE_KEY="${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
            --from-literal=NEO4J_PASSWORD="${{ secrets.NEO4J_PASSWORD || 'prodpassword123' }}" \
            -n starships-prod
          
          kubectl create secret generic kinde-auth-secret \
            --from-literal=KINDE_CLIENT_ID="${{ secrets.KINDE_CLIENT_ID }}" \
            --from-literal=KINDE_CLIENT_SECRET="${{ secrets.KINDE_CLIENT_SECRET }}" \
            -n starships-prod
          
          # Create GitHub registry secret
          kubectl delete secret ghcr-pull-secret -n starships-prod --ignore-not-found=true
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            -n starships-prod
          
          echo "✅ Prod secrets updated successfully"

      - name: Update image in deployment
        run: |
          # Force a new rollout by updating with timestamp annotation
          kubectl patch deployment starships-app -n starships-prod \
            -p '{"spec":{"template":{"metadata":{"annotations":{"deployment.kubernetes.io/revision":"'$(date +%s)'"}}}}}'
          
          # Also ensure we're using the latest image
          kubectl set image deployment/starships-app \
            starships=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-latest \
            -n starships-prod
          
          # Wait for rollout
          kubectl rollout status deployment/starships-app -n starships-prod --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n starships-prod
          
          # Wait for app to be ready
          sleep 30
          
          # Test health endpoint
          kubectl exec -n starships-prod deployment/starships-app -- \
            curl -s http://localhost:3001/health | jq '.' || echo "Health check failed"
          
          # Test main site
          curl -s -o /dev/null -w "%{http_code}" https://starships.ai | grep "200\|301\|302" || echo "Site check failed"

      - name: Deployment Summary
        run: |
          echo "🚀 Production deployment completed!"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-latest"
          echo "🌐 URL: https://starships.ai"
          echo "📅 Time: $(date)"

  # Workflow Summary (runs always to provide feedback)
  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [calculate-version]
    if: always() && needs.calculate-version.result != 'skipped'
    steps:
      - name: Create workflow summary
        run: |
          echo "## 🔄 Build and Deploy Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.calculate-version.outputs.new_release_published }}" == "true" ]]; then
            echo "✅ **Semantic Version Check:** New version detected (\`${{ needs.calculate-version.outputs.new_release_version }}\`)" >> $GITHUB_STEP_SUMMARY
            echo "🏗️ **Build Status:** Development build proceeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Semantic Version Check:** No new version detected" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "🔧 **Build Status:** Manual override triggered" >> $GITHUB_STEP_SUMMARY
            else
              echo "⏭️ **Build Status:** Development build skipped (no meaningful changes)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY