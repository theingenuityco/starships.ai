apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starships-ingress
  namespace: starships-prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - starships.ai
    secretName: starships-tls
  rules:
  - host: starships.ai
    http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000