apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-app
  namespace: starships-prod
  labels:
    app: starships-ai
spec:
  replicas: 1  # Single replica for MVP
  selector:
    matchLabels:
      app: starships-ai
  template:
    metadata:
      labels:
        app: starships-ai
    spec:
      containers:
      - name: starships
        image: ghcr.io/theingenuityco/starships.ai:fix-docker-build
        imagePullPolicy: Always
        command: ["/app/startup.sh"]
        ports:
        - containerPort: 3000
          name: frontend
        - containerPort: 4000
          name: backend
        - containerPort: 7474
          name: neo4j-http
        - containerPort: 7687
          name: neo4j-bolt
        envFrom:
        - secretRef:
            name: starships-secrets
        env:
        - name: NODE_ENV
          value: "production"
        - name: SKIP_BUILD
          value: "true"
        - name: NEO4J_EXTERNAL_URI
          value: "neo4j+s://demo.neo4jlabs.com:7687"  # Use demo Neo4j for testing
        - name: NEO4J_USERNAME
          value: "movies"
        - name: NEO4J_PASSWORD
          value: "movies"
        - name: SKIP_INSTALL
          value: "true"
        resources:
          requests:
            memory: "1Gi"    # Minimum guaranteed
            cpu: "500m"      
          limits:
            memory: "3Gi"    # Increased for Neo4j
            cpu: "1500m"     
        volumeMounts:
        - name: neo4j-data
          mountPath: /var/lib/neo4j/data
        - name: app-sessions
          mountPath: /app/data/sessions
      imagePullSecrets:
      - name: ghcr-pull-secret
      volumes:
      - name: neo4j-data
        persistentVolumeClaim:
          claimName: neo4j-data-pvc
      - name: app-sessions
        persistentVolumeClaim:
          claimName: sessions-pvc