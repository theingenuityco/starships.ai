apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: starships-dev
  region: ap-south-1
  version: '1.34'

managedNodeGroups:
  - name: dev-nodes
    instanceType: t4g.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 30
    privateNetworking: true
    iam:
      withAddonPolicies:
        ebs: true
