version: '3.8'

services:
  neo4j:
    image: neo4j:5.26.8
    container_name: neo4j-mcp
    environment:
      - NEO4J_AUTH=neo4j/starships123
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - starships-network

  server:
    build:
      context: ../../
      dockerfile: packages/server/Dockerfile.neo4j
    container_name: starships-server
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=starships123
      - NEO4J_DATABASE=neo4j
    ports:
      - "4000:4000"
    depends_on:
      - neo4j
    networks:
      - starships-network
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  starships-network:
    driver: bridge 