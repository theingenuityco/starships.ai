apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starships-ingress
  namespace: starships-prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - starships.ai
    secretName: starships-tls
  rules:
  - host: starships.ai
    http:
      paths:
      # Frontend routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Backend API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 4000
      # Socket.IO routes
      - path: /socket.io
        pathType: ImplementationSpecific
        backend:
          service:
            name: starships-app-internal
            port:
              number: 4000