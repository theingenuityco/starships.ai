name: Release and Publish

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write
  id-token: write
  issues: write
  pull-requests: read
  actions: read

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      release_notes: ${{ steps.semantic.outputs.release_notes }}
    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Setup Node and pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.12.4

      # Install dependencies for semantic-release
      - name: Install dependencies
        run: pnpm add -D semantic-release @semantic-release/git @semantic-release/github

      # Calculate version without making any changes
      - name: Calculate Semantic Version
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run semantic-release in dry-run mode to calculate version
          npx semantic-release --dry-run > semantic-output.txt 2>&1 || true
          
          # Extract the next version from dry-run output
          NEXT_VERSION=$(grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+' semantic-output.txt || echo "")
          
          if [ -z "$NEXT_VERSION" ]; then
            echo "No new version to release"
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
            
            # Save release notes for later
            echo "release_notes<<EOF" >> $GITHUB_OUTPUT
            grep -A 1000 "Release notes" semantic-output.txt | tail -n +2 >> $GITHUB_OUTPUT || echo "Release ${NEXT_VERSION}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

  docker:
    name: Build and Push Docker
    needs: version
    if: needs.version.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_pushed: ${{ steps.digest.outputs.pushed }}
      image_digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert repository name to lowercase (GHCR requires lowercase)
      - name: Convert IMAGE_NAME to lowercase
        run: |
          echo "IMAGE_NAME_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Temporarily update package.json version for Docker build
      - name: Update package.json version for build
        run: |
          npm version ${{ needs.version.outputs.new_release_version }} --no-git-tag-version --allow-same-version

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=raw,value=${{ needs.version.outputs.new_release_version }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ needs.version.outputs.new_release_version }}
            REVISION=${{ github.sha }}
          secrets: |
            stripe_secret_key=${{ secrets.STRIPE_SECRET_KEY }}
            stripe_publishable_key=${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Generate image digest
        id: digest
        run: |
          # Wait a moment for the image to be fully available
          sleep 5
          
          # Try to get the digest, filtering out any extra output
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest 2>/dev/null | grep -oP 'Digest:\s*\K[^\s]+' | head -1 || echo "")
          
          # If that didn't work, try the format approach
          if [ -z "$DIGEST" ]; then
            DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest --format '{{.Manifest.Digest}}' 2>/dev/null | head -1 || echo "")
          fi
          
          # Default to unknown if we still don't have it
          if [ -z "$DIGEST" ]; then
            DIGEST="unknown"
          fi
          
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "Found digest: ${DIGEST}"
          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Image scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ needs.version.outputs.new_release_version }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

  release:
    name: Commit Version and Create Release
    needs: [version, docker]
    if: needs.docker.outputs.image_pushed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Setup Node and pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.12.4

      # Install dependencies for semantic-release
      - name: Install dependencies
        run: pnpm add -D semantic-release @semantic-release/git @semantic-release/github

      # Now run actual semantic-release to commit version and create release
      - name: Commit Version and Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          # Configure semantic-release to create GitHub release with Docker info
          cat > .releaserc.json << 'EOF'
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              ["@semantic-release/npm", {
                "npmPublish": false
              }],
              ["@semantic-release/git", {
                "assets": ["package.json"],
                "message": "chore(release): ${nextRelease.version} [skip ci]"
              }],
              ["@semantic-release/github", {
                "successComment": false,
                "failComment": false,
                "releasedLabels": false,
                "addReleases": "top",
                "releaseBodyTemplate": "## Docker Image\n\n🐳 **Docker Image Published to GHCR**\n\n```bash\ndocker pull ghcr.io/${{ github.repository }}:${{ needs.version.outputs.new_release_version }}\n```\n\n## Release Notes\n\n<%= nextRelease.notes %>"
              }]
            ]
          }
          EOF
          
          # Run semantic-release to commit and create release
          npx semantic-release

      - name: Create deployment summary
        run: |
          echo "## 🚀 Release Successfully Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.version.outputs.new_release_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image:** \`ghcr.io/${{ github.repository }}:${{ needs.version.outputs.new_release_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**GitHub Release:** [View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.version.outputs.new_release_version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}:${{ needs.version.outputs.new_release_version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY