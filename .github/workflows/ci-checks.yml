name: CI Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm --version
          # Configure pnpm to use the official npm registry
          pnpm config set registry https://registry.npmjs.org

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm run lint

  type-check:
    name: Type Check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm --version
          # Configure pnpm to use the official npm registry
          pnpm config set registry https://registry.npmjs.org

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: pnpm run type-check

  test:
    name: Test Check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm --version
          # Configure pnpm to use the official npm registry
          pnpm config set registry https://registry.npmjs.org

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  build:
    name: Build Check
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    needs: [lint, type-check, test]
    environment: ci
    env:
      # Core Configuration
      NODE_ENV: ${{ vars.NODE_ENV }}
      SERVER_PORT: ${{ vars.SERVER_PORT }}
      CLIENT_PORT: ${{ vars.CLIENT_PORT }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}

      # URLs
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      CLIENT_URL: ${{ vars.CLIENT_URL }}
      SERVER_URL: ${{ vars.SERVER_URL }}

      # Authentication
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

      # Neo4j (mock values for CI build)
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}

      # LLM Providers (optional for build)
      DEFAULT_LLM_PROVIDER: ${{ vars.DEFAULT_LLM_PROVIDER }}
      DEFAULT_CHAT_MODEL: ${{ vars.DEFAULT_CHAT_MODEL }}

      # Stripe Configuration
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      # Analytics (optional for CI)
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm --version
          # Configure pnpm to use the official npm registry
          pnpm config set registry https://registry.npmjs.org

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build
