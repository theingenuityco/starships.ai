name: Publish Docker Image to GHCR

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push to GitHub Container Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/starships.ai:latest .

      - name: Push Image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/starships.ai:latest

      - name: (Optional) Ping RunPod to Redeploy
        if: success() && secrets.RUNPOD_WEBHOOK_URL != ''
        env:
          RUNPOD_ENDPOINT: ${{ secrets.RUNPOD_WEBHOOK_URL }}
          AUTH_HEADER: ${{ secrets.RUNPOD_AUTH_HEADER }}
        run: |
          curl -s -X POST "$RUNPOD_ENDPOINT" \
            -H "Authorization: $AUTH_HEADER" 