apiVersion: v1
kind: Service
metadata:
  name: starships-app-headless
  namespace: starships-dev
  labels:
    app: starships-ai
    environment: dev
spec:
  clusterIP: None
  selector:
    app: starships-ai
    environment: dev
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: starships-app
  namespace: starships-dev
  labels:
    app: starships-ai
    environment: dev
spec:
  serviceName: starships-app-headless
  replicas: 1
  revisionHistoryLimit: 2
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: starships-ai
      environment: dev
  template:
    metadata:
      labels:
        app: starships-ai
        environment: dev
    spec:
      serviceAccountName: autopilot-runner
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: init-starships-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /mnt/postgresql /mnt/app-data/sessions || true
          volumeMounts:
            - name: starships-data
              mountPath: /mnt
      containers:
        - name: starships
          image: ghcr.io/theingenuityco/starships.ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: frontend
            - containerPort: 4000
              name: backend
            - containerPort: 5432
              name: postgres

          env:
            - name: NODE_ENV
              value: 'development'
            - name: AUTOPILOT_RUNNER
              value: 'k8s'
            - name: AUTOPILOT_K8S_IMAGE
              value: 'ghcr.io/theingenuityco/autopilot-runner:latest'
            - name: AUTOPILOT_K8S_NAMESPACE
              value: 'starships-dev'
            - name: SKIP_BUILD
              value: 'true'
            - name: SKIP_INSTALL
              value: 'true'
            - name: PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: PUBLIC_URL
            - name: CLIENT_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: CLIENT_URL
            - name: SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SERVER_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: JWT_SECRET
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_DATABASE
            - name: POSTGRES_SSL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_SSL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: ANTHROPIC_API_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENROUTER_API_KEY
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_PUBLISHABLE_KEY
            - name: GA_MEASUREMENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GA_MEASUREMENT_ID
            - name: GH_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GH_OAUTH_CLIENT_ID
            - name: GH_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GH_OAUTH_CLIENT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: PGDATA
              value: '/var/lib/postgresql/data/pgdata'

          readinessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: starships-data
              mountPath: /var/lib/postgresql
              subPath: postgres
            - name: starships-data
              mountPath: /app/data
              subPath: app-data

          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '2Gi'

  volumeClaimTemplates:
    - metadata:
        name: starships-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 50Gi
