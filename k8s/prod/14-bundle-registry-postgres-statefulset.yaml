apiVersion: v1
kind: Service
metadata:
  name: bundle-registry-postgres
  namespace: starships-prod
  labels:
    app: bundle-registry-postgres
    environment: prod
spec:
  type: ClusterIP
  selector:
    app: bundle-registry-postgres
    environment: prod
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bundle-registry-postgres
  namespace: starships-prod
  labels:
    app: bundle-registry-postgres
    environment: prod
spec:
  serviceName: bundle-registry-postgres
  replicas: 1
  selector:
    matchLabels:
      app: bundle-registry-postgres
      environment: prod
  template:
    metadata:
      labels:
        app: bundle-registry-postgres
        environment: prod
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: BUNDLE_REGISTRY_POSTGRES_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: BUNDLE_REGISTRY_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: BUNDLE_REGISTRY_POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: bundle-registry-postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: bundle-registry-postgres
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '2000m'
              memory: '4Gi'
  volumeClaimTemplates:
    - metadata:
        name: bundle-registry-postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 50Gi

