name: CI Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm --version
          # Configure pnpm to use the official npm registry
          pnpm config set registry https://registry.npmjs.org

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm --version
          # Configure pnpm to use the official npm registry
          pnpm config set registry https://registry.npmjs.org

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: pnpm run type-check

  test:
    name: Test Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm --version
          # Configure pnpm to use the official npm registry
          pnpm config set registry https://registry.npmjs.org

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, type-check, test]
    environment: ci
    env:
      # Core Configuration
      NODE_ENV: development
      SERVER_PORT: 4000
      CLIENT_PORT: 3000
      LOG_LEVEL: info

      # URLs
      PUBLIC_URL: http://localhost:3000
      CLIENT_URL: http://localhost:3000
      SERVER_URL: http://localhost:4000

      # Authentication
      JWT_SECRET: test-jwt-secret-for-ci-only-at-least-32-chars

      # Neo4j (mock values for CI build)
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j

      # LLM Providers (optional for build)
      DEFAULT_LLM_PROVIDER: openai
      DEFAULT_CHAT_MODEL: gpt-4o

      # Stripe Configuration
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

      # Analytics (optional for CI)
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-CI-TEST-ID

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          curl -fsSL https://github.com/pnpm/pnpm/releases/download/v10.12.4/pnpm-linux-x64 -o pnpm
          chmod +x pnpm
          sudo mv pnpm /usr/local/bin/
          pnpm --version
          # Configure pnpm to use the official npm registry
          pnpm config set registry https://registry.npmjs.org

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build
