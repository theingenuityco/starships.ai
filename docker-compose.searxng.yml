version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng-local
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET_KEY=please-change-me-to-a-random-string
    volumes:
      - ./searxng-settings:/etc/searxng
    restart: unless-stopped

  # Updated MCP bridge to use local Searxng
  mcp-searxng-local:
    image: starships/mcp-http-bridge:latest
    container_name: mcp-searxng-local
    command: ['node', '/app/server.js']
    ports:
      - "8889:8080"
    environment:
      MCP_SERVER_CMD: 'npx'
      MCP_SERVER_ARGS: '-y mcp-searxng http://searxng:8080/'
      HTTP_PORT: '8080'
      LOG_LEVEL: 'debug'
      HEALTH_CHECK_TIMEOUT: '30000'
      MAX_CONCURRENT_REQUESTS: '10'
      INIT_TIMEOUT: '120000'
      NPX_DOWNLOAD_TIMEOUT: '60000'
    depends_on:
      - searxng
    networks:
      - default

networks:
  default:
    name: searxng-network