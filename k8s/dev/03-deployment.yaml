apiVersion: apps/v1
kind: Deployment
metadata:
  name: starships-app
  namespace: starships-dev
  labels:
    app: starships-ai
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: starships-ai
      environment: dev
  template:
    metadata:
      labels:
        app: starships-ai
        environment: dev
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      # Security Context
      securityContext:
        runAsUser: 0
        fsGroup: 1000
      
      imagePullSecrets:
      - name: ghcr-pull-secret
      
      containers:
      - name: starships
        image: ghcr.io/theingenuityco/starships.ai:3.8.2
        imagePullPolicy: Always
        
        ports:
        - containerPort: 3000
          name: frontend
          protocol: TCP
        - containerPort: 4000
          name: backend
          protocol: TCP
        - containerPort: 7474
          name: neo4j-http
          protocol: TCP
        - containerPort: 7687
          name: neo4j-bolt
          protocol: TCP
        
        # Development Environment Variables
        env:
        # Core Settings
        - name: NODE_ENV
          value: "production"
        - name: SKIP_BUILD
          value: "true"
        - name: SKIP_INSTALL
          value: "true"
        
        # URLs
        - name: CLIENT_URL
          value: "https://dev.starships.ai"
        - name: NEXT_PUBLIC_API_URL
          value: "https://dev.starships.ai/api"
        - name: NEXT_PUBLIC_SERVER_URL
          value: "https://dev.starships.ai/api"
        - name: SERVER_URL
          value: "http://localhost:4000"
        
        # Neo4j Configuration
        - name: NEO4J_URI
          value: "bolt://localhost:7687"
        - name: NEO4J_USERNAME
          value: "neo4j"
        - name: NEO4J_PASSWORD
          value: "mcppassword"
        - name: NEO4J_AUTH
          value: "neo4j/mcppassword"
        
        # Kinde OAuth
        - name: KINDE_ISSUER_URL
          value: "https://starshipsai.kinde.com"
        - name: KINDE_SITE_URL
          value: "https://dev.starships.ai"
        - name: KINDE_POST_LOGIN_REDIRECT_URL
          value: "https://dev.starships.ai/fleet"
        - name: KINDE_POST_LOGOUT_REDIRECT_URL
          value: "https://dev.starships.ai"
        # Note: Removed KINDE_REDIRECT_URL - not a valid Kinde env var
        # Callback URL must be configured in Kinde dashboard instead
        
        # Security: Disable testing backdoor, enable debug for dev
        - name: NEXT_PUBLIC_ENABLE_AUTH_TESTING_BACKDOOR
          value: "false"  # Use proper Kinde authentication
        - name: KINDE_DEBUG_MODE
          value: "true"   # Enable debug logs for development
        
        # API Keys from Secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: OPENAI_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: ANTHROPIC_API_KEY
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_WEBHOOK_SECRET
        - name: STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: starships-secrets
              key: STRIPE_PUBLISHABLE_KEY
        
        # Pull Kinde secrets
        envFrom:
        - secretRef:
            name: kinde-auth-secret
        
        # Resource Limits
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        # Volume Mounts
        volumeMounts:
        - name: neo4j-data
          mountPath: /var/lib/neo4j/data
        - name: app-sessions
          mountPath: /app/data/sessions
        
      # Volumes
      volumes:
      - name: neo4j-data
        persistentVolumeClaim:
          claimName: neo4j-data-pvc
      - name: app-sessions
        persistentVolumeClaim:
          claimName: sessions-pvc