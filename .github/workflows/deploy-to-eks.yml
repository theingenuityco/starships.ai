name: Deploy to AWS EKS

on:
  workflow_run:
    workflows: ["Build and Publish Docker Image"]
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-to-eks.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev

env:
  AWS_REGION: us-west-2  # Change to your AWS region
  EKS_CLUSTER_NAME: starships-cluster  # Change to your EKS cluster name
  NAMESPACE: starships-ai
  IMAGE_NAME: ghcr.io/theingenuityco/starships.ai

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    
    permissions:
      contents: read
      packages: read
      id-token: write  # Required for AWS OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}  # IAM role for GitHub Actions
          role-session-name: github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create image pull secret for GHCR
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --docker-email=${{ github.actor }}@users.noreply.github.com \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create application secrets
        run: |
          # Create secrets from GitHub Secrets
          kubectl create secret generic starships-secrets \
            --from-literal=NEO4J_PASSWORD="${{ secrets.NEO4J_PASSWORD }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            --from-literal=STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --from-literal=STRIPE_PORTAL_ENDPOINT="${{ secrets.STRIPE_PORTAL_ENDPOINT }}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Get latest image digest
        id: image
        run: |
          # Get the latest image digest from GHCR
          DIGEST=$(docker manifest inspect ${{ env.IMAGE_NAME }}:latest | jq -r '.digest')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "image=${{ env.IMAGE_NAME }}@${DIGEST}" >> $GITHUB_OUTPUT

      - name: Apply Kubernetes manifests
        run: |
          # Apply RBAC
          kubectl apply -f k8s/base/rbac.yaml

          # Apply ConfigMap
          kubectl apply -f k8s/base/configmap.yaml

          # Apply Persistent Volumes
          kubectl apply -f k8s/base/persistent-volumes.yaml

          # Apply Deployment with updated image
          sed "s|ghcr.io/theingenuityco/starships.ai:latest|${{ steps.image.outputs.image }}|g" k8s/base/deployment.yaml | \
          kubectl apply -f -

          # Apply Service
          kubectl apply -f k8s/base/service.yaml

          # Apply HPA
          kubectl apply -f k8s/base/hpa.yaml

          # Apply Ingress with domain and certificate
          sed "s/starships.yourdomain.com/${{ secrets.DOMAIN_NAME }}/g" k8s/base/ingress.yaml | \
          sed "s/\${ACM_CERTIFICATE_ARN}/${{ secrets.ACM_CERTIFICATE_ARN }}/g" | \
          kubectl apply -f -

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/starships-app -n ${{ env.NAMESPACE }} --timeout=10m

      - name: Verify deployment
        run: |
          echo "🚀 Deployment Status:"
          kubectl get deployment -n ${{ env.NAMESPACE }}
          
          echo ""
          echo "📦 Pods Status:"
          kubectl get pods -n ${{ env.NAMESPACE }}
          
          echo ""
          echo "🔗 Service Status:"
          kubectl get service -n ${{ env.NAMESPACE }}
          
          echo ""
          echo "🌐 Ingress Status:"
          kubectl get ingress -n ${{ env.NAMESPACE }}

      - name: Get application URL
        run: |
          # Get ALB URL
          ALB_URL=$(kubectl get ingress starships-ingress -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || echo "pending")
          
          echo "## 🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Application URLs:" >> $GITHUB_STEP_SUMMARY
          echo "- ALB URL: http://${ALB_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- Domain: https://${{ secrets.DOMAIN_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Configure DNS to point to ALB: ${ALB_URL}" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify application health" >> $GITHUB_STEP_SUMMARY

      - name: Run smoke tests
        run: |
          # Wait for service to be ready
          sleep 30
          
          # Get the service endpoint
          ALB_URL=$(kubectl get ingress starships-ingress -n ${{ env.NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          if [ ! -z "$ALB_URL" ]; then
            echo "Running smoke tests against: http://${ALB_URL}"
            
            # Test health endpoint
            curl -f -s -o /dev/null -w "Health check status: %{http_code}\n" http://${ALB_URL}/api/health || true
            
            # Test frontend
            curl -f -s -o /dev/null -w "Frontend status: %{http_code}\n" http://${ALB_URL} || true
          else
            echo "⚠️ ALB URL not yet available, skipping smoke tests"
          fi

      # - name: Slack notification (optional)
      #   if: always()
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ job.status }}
      #     text: |
      #       Deployment to EKS ${{ job.status }}
      #       Environment: ${{ github.event.inputs.environment || 'production' }}
      #       Commit: ${{ github.sha }}
      #       Author: ${{ github.actor }}
      #     webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      #   continue-on-error: true