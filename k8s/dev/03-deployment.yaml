apiVersion: v1
kind: Service
metadata:
  name: starships-app-headless
  namespace: starships-dev
  labels:
    app: starships-ai
    environment: dev
spec:
  clusterIP: None
  selector:
    app: starships-ai
    environment: dev
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: starships-app
  namespace: starships-dev
  labels:
    app: starships-ai
    environment: dev
spec:
  serviceName: starships-app-headless
  replicas: 1
  revisionHistoryLimit: 2
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: starships-ai
      environment: dev
  template:
    metadata:
      labels:
        app: starships-ai
        environment: dev
    spec:
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "🔧 Fixing permissions for /app/packages/docs..."
              mkdir -p /app/packages/docs/.source
              chmod -R 777 /app/packages/docs || true
              echo "✅ Permissions fixed for /app/packages/docs"
          volumeMounts:
            - name: starships-data
              mountPath: /app/data
              subPath: app-data
            - name: starships-data
              mountPath: /app/packages/docs/.source
              subPath: docs-source

      containers:
        - name: starships
          image: ghcr.io/theingenuityco/starships.ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: frontend
            - containerPort: 3001
              name: docs
            - containerPort: 4000
              name: backend

          env:
            - name: NODE_ENV
              value: 'development'
            - name: AUTOPILOT_RUNNER
              value: 'remote'
            - name: RUNNER_URL
              value: 'http://autopilot-runner.starships-dev.svc.cluster.local:50051'
            - name: RUNNER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: RUNNER_AUTH_TOKEN
            - name: SKIP_BUILD
              value: 'true'
            - name: SKIP_INSTALL
              value: 'true'
            - name: PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: PUBLIC_URL
            - name: CLIENT_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: CLIENT_URL
            - name: SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SERVER_URL
            - name: DOCS_URL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DOCS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: JWT_SECRET
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_DATABASE
            - name: POSTGRES_SSL
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_SSL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: ANTHROPIC_API_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: OPENROUTER_API_KEY
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: STRIPE_PUBLISHABLE_KEY
            - name: GA_MEASUREMENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GA_MEASUREMENT_ID
            - name: USERBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: USERBACK_TOKEN
            - name: SENTRY_DSN_CLIENT
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SENTRY_DSN_CLIENT
            - name: SENTRY_DSN_SERVER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: SENTRY_DSN_SERVER
            # OAuth (GitHub OAuth App for login)
            - name: GH_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GH_OAUTH_CLIENT_ID
            - name: GH_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GH_OAUTH_CLIENT_SECRET
            # GitHub App (used for GitHub connector)
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GITHUB_APP_PRIVATE_KEY_BASE64
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: LINKEDIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: LINKEDIN_CLIENT_ID
            - name: LINKEDIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: LINKEDIN_CLIENT_SECRET
            - name: GOOGLE_DRIVE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_DRIVE_CLIENT_ID
            - name: GOOGLE_DRIVE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: GOOGLE_DRIVE_CLIENT_SECRET
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DISCORD_CLIENT_ID
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DISCORD_CLIENT_SECRET
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: DISCORD_BOT_TOKEN
            - name: EMAIL_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: EMAIL_FROM_ADDRESS
            - name: EMAIL_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: EMAIL_FROM_NAME
            - name: AWS_SES_REGION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_SES_REGION
            - name: AWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_S3_BUCKET
            - name: AWS_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: AWS_S3_REGION
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: ENCRYPTION_KEY

          readinessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: starships-data
              mountPath: /app/data
              subPath: app-data
            - name: starships-data
              mountPath: /app/packages/docs/.source
              subPath: docs-source

          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '2Gi'

  volumeClaimTemplates:
    - metadata:
        name: starships-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 50Gi
