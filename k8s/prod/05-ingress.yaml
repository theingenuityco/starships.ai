apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starships-app-ingress
  namespace: starships-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # WebSocket support for Socket.IO
    nginx.ingress.kubernetes.io/websocket-services: "starships-app-internal"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-set-headers: |
      Upgrade $http_upgrade
      Connection "upgrade"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - starships.ai
    - www.starships.ai
    secretName: starships-tls-cert
  rules:
  - host: starships.ai
    http:
      paths:
      # Next.js API routes (must come BEFORE general /api rule)
      # Auth routes (Kinde)
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Runtime config route
      - path: /api/config
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Backend proxy route
      - path: /api/backend
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Pricing route
      - path: /api/pricing
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Waitlist routes
      - path: /api/waitlist
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Socket.IO WebSocket route
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3001
      # Other API routes go to backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3001
      # Everything else goes to frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
  - host: www.starships.ai
    http:
      paths:
      # Next.js API routes (must come BEFORE general /api rule)
      # Auth routes (Kinde)
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Runtime config route
      - path: /api/config
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Backend proxy route
      - path: /api/backend
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Pricing route
      - path: /api/pricing
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Waitlist routes
      - path: /api/waitlist
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000
      # Socket.IO WebSocket route
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3001
      # Other API routes go to backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3001
      # Everything else goes to frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: starships-app-internal
            port:
              number: 3000