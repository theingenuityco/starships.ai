apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: starships-dev
  labels:
    app: postgres
    environment: dev
spec:
  type: ClusterIP
  selector:
    app: postgres
    environment: dev
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: starships-dev
  labels:
    app: postgres
    environment: dev
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      environment: dev
  template:
    metadata:
      labels:
        app: postgres
        environment: dev
    spec:
      initContainers:
        - name: migrate-postgres-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e

              # If the new volume already contains an initialized cluster, do nothing
              if [ -f /new/data/pgdata/postgresql.conf ] && [ -f /new/data/pgdata/PG_VERSION ]; then
                echo "New Postgres data already initialized; skipping migration."
                exit 0
              fi

              # The old fat-container StatefulSet stored Postgres data under the 'postgres'
              # subPath on the shared PVC, so the actual cluster lives at:
              #   /old/postgres/pgdata
              if [ ! -d /old/postgres/pgdata ] || \
                 [ ! -f /old/postgres/pgdata/postgresql.conf ] || \
                 [ ! -f /old/postgres/pgdata/PG_VERSION ]; then
                echo "No existing Postgres cluster found at /old/postgres/pgdata; skipping migration."
                exit 0
              fi

              echo "Copying existing Postgres data from old volume to new volume..."
              mkdir -p /new/data
              # Copy ONLY the 'postgres' subdirectory so that on the new PVC the cluster
              # ends up at /postgres/pgdata, which maps to /var/lib/postgresql/data/pgdata
              # in the postgres container.
              cp -a /old/postgres/. /new/data/.
              echo "Postgres data copy complete."
          volumeMounts:
            - name: old-postgres-data
              mountPath: /old
            - name: postgres-data
              mountPath: /new/data
              subPath: postgres
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            # Use the same credentials and database name as the application
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_DATABASE
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: starships-secrets
                  key: POSTGRES_PASSWORD
            # Ensure PGDATA matches the in-container path used by the fat container
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '2Gi'
      volumes:
        # Old PVC from starships-app; used only for one-time data migration
        - name: old-postgres-data
          persistentVolumeClaim:
            claimName: starships-data-starships-app-0
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 50Gi
